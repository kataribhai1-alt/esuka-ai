<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0f">
<title>ESUKA AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#090a0f;
  --panel:#101118;
  --border:#262832;
  --muted:#9295a3;
  --accent:#9877ff;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:#f5f5f8;
  height:100dvh;
  overflow:hidden;
}

button{font-family:inherit}

.app{display:flex;height:100dvh}

/* SIDEBAR */

.sidebar{
  width:270px;
  flex-shrink:0;
  background:#0c0d13;
  border-right:1px solid var(--border);
  padding:21px;
  display:flex;
  flex-direction:column;
  transition:left .3s;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:1.5px;
  background:linear-gradient(100deg,#bd9aff,#62c7ff);
  -webkit-background-clip:text;
  color:transparent;
}

.tagline{
  color:#777b89;
  font-size:10px;
  letter-spacing:1.4px;
  margin-top:6px;
}

.newchat{
  margin-top:30px;
  padding:13px;
  border-radius:13px;
  background:#191a24;
  border:1px solid #30313e;
  color:white;
  font-size:14px;
  cursor:pointer;
}

.newchat:hover{background:#252637}

.sideheading{
  font-size:10px;
  color:#777b89;
  letter-spacing:1.5px;
  margin:28px 0 12px;
}

.history{overflow-y:auto;flex:1}

.history-item{
  padding:12px;
  border-radius:10px;
  color:#c4c6d1;
  font-size:13px;
  cursor:pointer;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item.active,.history-item:hover{
  background:#20212c;
}

.sidebar-bottom{
  font-size:11px;
  color:#777b89;
  padding-top:15px;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100%;
}

.topbar{
  height:65px;
  border-bottom:1px solid #22232c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 23px;
  flex-shrink:0;
  background:#0b0c12;
}

.topname{font-weight:750;font-size:15px}

.status{
  font-size:11px;
  color:#63d7a2;
  margin-top:5px;
}

.menu{
  display:none;
  background:none;
  color:white;
  border:0;
  font-size:23px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 18px;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}

.welcome{
  text-align:center;
  margin:12vh auto 30px;
  max-width:550px;
}

.orb{
  width:76px;
  height:76px;
  border-radius:25px;
  margin:0 auto 25px;
  background:linear-gradient(135deg,#9167ff,#43b9f7);
  display:grid;
  place-items:center;
  font-size:31px;
  box-shadow:0 0 65px #7955ff35;
}

.welcome h1{
  font-size:32px;
  margin-bottom:12px;
  letter-spacing:-.8px;
}

.gradient{
  background:linear-gradient(90deg,#bd9aff,#62c7ff);
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  color:#9295a3;
  line-height:1.7;
  font-size:14px;
}

.suggestions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:27px;
}

.suggestion{
  background:#14151d;
  border:1px solid #292b37;
  padding:12px 15px;
  border-radius:13px;
  color:#d0d2dc;
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}

.suggestion:hover{
  background:#222431;
  border-color:#7864c5;
}

/* MESSAGES */

.messages{
  max-width:850px;
  margin:auto;
}

.message{
  display:flex;
  gap:13px;
  margin:25px 0;
  align-items:flex-start;
}

.avatar{
  width:35px;
  height:35px;
  flex-shrink:0;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#252039;
  font-size:14px;
}

.user .avatar{background:#19364a}

.message-wrap{
  max-width:88%;
  min-width:0;
}

.content{
  background:#151720;
  border:1px solid #292b36;
  padding:14px 17px;
  border-radius:5px 17px 17px 17px;
  line-height:1.75;
  font-size:14px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user{justify-content:flex-end}
.user .message-wrap{order:1}
.user .avatar{order:2}

.user .content{
  background:#20212d;
  border:1px solid #343543;
  border-radius:17px 5px 17px 17px;
}

.msg-actions{
  margin-top:9px;
  display:flex;
  gap:8px;
}

.small-btn{
  border:1px solid #30323e;
  background:#171821;
  color:#b8bac7;
  border-radius:9px;
  padding:8px 12px;
  font-size:11px;
  cursor:pointer;
}

.small-btn:hover{
  background:#282a37;
  color:white;
}

.typing{
  color:#a4a6b3;
  font-size:13px;
  padding:12px;
}

.generated-image{
  display:block;
  width:100%;
  max-width:450px;
  height:auto;
  margin-top:12px;
  border-radius:14px;
}

/* COMPOSER */

.composer-wrap{
  padding:12px 18px 20px;
  flex-shrink:0;
  background:linear-gradient(transparent,#090a0f 20%);
}

.composer{
  max-width:850px;
  margin:auto;
  background:#171920;
  border:1px solid #353743;
  border-radius:24px;
  padding:9px 10px;
  display:flex;
  align-items:flex-end;
  gap:9px;
  box-shadow:0 12px 45px #0007;
  transition:border-color .2s,box-shadow .2s;
}

.composer:focus-within{
  border-color:#8069d0;
  box-shadow:0 0 0 3px #8068dc18,0 12px 45px #0007;
}

textarea{
  flex:1;
  resize:none;
  max-height:130px;
  min-height:42px;
  background:transparent;
  border:0;
  outline:0;
  color:#f7f7fa;
  padding:12px 9px;
  font-size:16px;
  font-family:inherit;
  line-height:1.5;
  caret-color:#a78bfa;
}

textarea::placeholder{color:#858895}

.icon-btn{
  width:41px;
  height:41px;
  border:0;
  border-radius:14px;
  background:#292c37;
  color:#e1e2ea;
  cursor:pointer;
  font-size:17px;
  flex-shrink:0;
  transition:.2s;
}

.icon-btn:hover{background:#393c4a}

.mic.listening{
  background:#d84d70;
  animation:pulse 1s infinite;
}

.send{
  background:linear-gradient(135deg,#9270ff,#529fff);
  color:white;
  font-size:19px;
}

.send:hover{filter:brightness(1.12)}

.icon-btn:disabled{
  opacity:.5;
  cursor:wait;
}

@keyframes pulse{
  50%{box-shadow:0 0 0 8px #e34c7033}
}

.note{
  text-align:center;
  color:#737684;
  font-size:10px;
  margin-top:10px;
}

/* MOBILE */

@media(max-width:650px){

  .sidebar{
    position:fixed;
    z-index:5;
    left:-280px;
    top:0;
    bottom:0;
    height:100dvh;
  }

  .sidebar.open{left:0}

  .menu{display:block}

  .topbar{padding:0 14px}

  .chat{padding:20px 12px}

  .welcome{margin-top:10vh}

  .welcome h1{font-size:27px}

  .composer-wrap{padding:10px 10px 16px}

  .composer{
    border-radius:23px;
    padding:8px;
    gap:7px;
  }

  .message-wrap{max-width:90%}

  .avatar{width:32px;height:32px}

  textarea{font-size:16px}

}

</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">ESUKA AI</div>
  <div class="tagline">YOUR PERSONAL AI ASSISTANT</div>

  <button class="newchat" onclick="newChat()">＋ New Chat</button>

  <div class="sideheading">RECENT CONVERSATIONS</div>
  <div class="history" id="historyList"></div>

  <div class="sidebar-bottom">Created with care by Katari</div>
</aside>

<main class="main">

<header class="topbar">
  <div style="display:flex;align-items:center;gap:13px">
    <button class="menu" onclick="toggleSidebar()">☰</button>
    <div>
      <div class="topname">ESUKA AI <span style="color:#9877ff">✦</span></div>
      <div class="status">● Online Assistant</div>
    </div>
  </div>

  <button class="small-btn" onclick="stopSpeech()">⏹ Stop Voice</button>
</header>

<section class="chat" id="chat">

  <div class="welcome" id="welcome">
    <div class="orb">✦</div>

    <h1>Hey! I'm <span class="gradient">ESUKA AI</span></h1>

    <p>Your personal AI assistant. Ask me anything, share your ideas or just start a conversation.</p>

    <div class="suggestions">
      <button class="suggestion" onclick="useSuggestion('Tell me something interesting')">✦ Tell me something</button>

      <button class="suggestion" onclick="useSuggestion('Help me learn coding')">⌘ Learn coding</button>

      <button class="suggestion" onclick="useSuggestion('Give me a creative idea')">✧ Creative ideas</button>

      <button class="suggestion" onclick="useSuggestion('Generate an image of a futuristic city at sunset')">🎨 Generate image</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

</section>

<div class="composer-wrap">
  <div class="composer">

    <button class="icon-btn mic" id="micBtn" onclick="toggleMic()" title="Voice input">🎙</button>

    <textarea id="input" rows="1" placeholder="Message ESUKA AI..."></textarea>

    <button class="icon-btn" onclick="stopSpeech()" title="Stop voice">■</button>

    <button class="icon-btn send" id="sendBtn" onclick="sendMessage()">➤</button>

  </div>

  <div class="note">AI voice will play only when you press Listen.</div>
</div>

</main>
</div>

<script>

const API_URL = "https://esuka-ai-web.kataribhai1.workers.dev/";

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const micBtn = document.getElementById("micBtn");
const sendBtn = document.getElementById("sendBtn");

let chats = [];

try {
  chats = JSON.parse(localStorage.getItem("esuka_ai_chats_v3") || "[]");
  if (!Array.isArray(chats)) chats = [];
} catch {
  chats = [];
}

let currentChat = null;
let conversation = [];
let recognition = null;
let listening = false;
let voices = [];
let sending = false;

function loadVoices() {
  if ("speechSynthesis" in window) {
    voices = speechSynthesis.getVoices();
  }
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function saveChats() {
  try {
    localStorage.setItem("esuka_ai_chats_v3", JSON.stringify(chats));
  } catch(error) {
    console.error("Chat storage error:",error);
  }
}

function newChat() {
  stopSpeech();
  currentChat = null;
  conversation = [];
  messages.innerHTML = "";
  welcome.style.display = "block";
  input.value = "";
  renderHistory();
  document.getElementById("sidebar").classList.remove("open");
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  chats.forEach(c => {
    const item = document.createElement("div");

    item.className =
      "history-item" + (c.id === currentChat ? " active" : "");

    item.textContent = "◈ " + c.title;
    item.onclick = () => openChat(c.id);

    list.appendChild(item);
  });
}

function openChat(id) {
  const selected = chats.find(c => c.id === id);
  if (!selected) return;

  stopSpeech();
  currentChat = id;
  conversation = [...selected.messages];
  messages.innerHTML = "";
  welcome.style.display = "none";

  conversation.forEach(m => {
    addMessage(m.role,m.content);
  });

  renderHistory();
  document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function useSuggestion(text) {
  input.value = text;
  sendMessage();
}

/* IMAGE REQUEST DETECTION */

function isImageRequest(text) {
  const value = text.toLowerCase().trim();

  const patterns = [
    /\b(generate|create|draw|design|make)\b.{0,100}\b(image|picture|photo|wallpaper|illustration|artwork)\b/i,
    /\b(image|picture|photo|wallpaper|illustration)\b.{0,80}\b(generate|create|draw|make)\b/i,
    /\b(image|photo|picture)\b.{0,50}\b(banao|banado|bana do|bana|generate|create)\b/i,
    /\b(banao|banado|bana do|bana)\b.{0,60}\b(image|photo|picture|tasveer)\b/i,
    /\b(tasveer|photo|image)\b.{0,60}\b(bana|banao|banado|create)\b/i,
    /\b(ek image|ek photo|ek tasveer|image bana|photo bana)\b/i
  ];

  return patterns.some(pattern => pattern.test(value));
}

/* MESSAGE DISPLAY */

function addMessage(role,text) {
  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "✦";

  const wrap = document.createElement("div");
  wrap.className = "message-wrap";

  const bubble = document.createElement("div");
  bubble.className = "content";
  bubble.textContent = text;

  wrap.appendChild(bubble);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "msg-actions";

    const listen = document.createElement("button");
    listen.className = "small-btn listen-btn";
    listen.textContent = "🔊 Listen";

    listen.onclick = () => {
      if (speechSynthesis.speaking) {
        stopSpeech();
        return;
      }

      document.querySelectorAll(".listen-btn").forEach(b => {
        b.textContent = "🔊 Listen";
      });

      listen.textContent = "⏹ Stop";
      speakText(text,listen);
    };

    actions.appendChild(listen);
    wrap.appendChild(actions);
  }

  row.appendChild(avatar);
  row.appendChild(wrap);
  messages.appendChild(row);

  chat.scrollTop = chat.scrollHeight;
}

/* IMAGE DISPLAY */

function addImageMessage(imageData) {

  if (
    typeof imageData !== "string" ||
    !imageData.startsWith("data:image/")
  ) {
    throw new Error("Invalid image data received.");
  }

  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message assistant";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "✦";

  const wrap = document.createElement("div");
  wrap.className = "message-wrap";

  const bubble = document.createElement("div");
  bubble.className = "content";

  const title = document.createElement("p");
  title.textContent = "Your image is ready!";

  const img = document.createElement("img");
  img.className = "generated-image";
  img.alt = "Image generated by ESUKA AI";
  img.src = imageData;

  bubble.appendChild(title);
  bubble.appendChild(img);

  wrap.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(wrap);

  messages.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

/* TYPING INDICATOR */

function showTyping(message) {
  removeTyping();

  const t = document.createElement("div");
  t.id = "typing";
  t.className = "typing";
  t.textContent = message || "ESUKA AI is thinking...";

  messages.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  document.getElementById("typing")?.remove();
}

/* SAVE CHAT */

function saveConversation() {

  const index = chats.findIndex(c => c.id === currentChat);

  if (index >= 0) {

    chats[index].messages = [...conversation];

    chats[index].title =
      conversation.find(m => m.role === "user")
        ?.content.slice(0,32) || "New Chat";

    const item = chats.splice(index,1)[0];
    chats.unshift(item);
  }

  saveChats();
  renderHistory();
}

/* SEND MESSAGE */

async function sendMessage() {

  if (sending) return;

  const text = input.value.trim();
  if (!text) return;

  sending = true;
  sendBtn.disabled = true;

  stopSpeech();

  input.value = "";
  input.style.height = "auto";

  const imageMode = isImageRequest(text);

  if (!currentChat) {

    currentChat = Date.now().toString();

    chats.unshift({
      id:currentChat,
      title:text.slice(0,32),
      messages:[]
    });
  }

  conversation.push({
    role:"user",
    content:text
  });

  addMessage("user",text);
  saveConversation();

  showTyping(
    imageMode
      ? "ESUKA AI is creating your image..."
      : "ESUKA AI is thinking..."
  );

  try {

    const requestBody = imageMode
      ? {
          mode:"image",
          message:text,
          prompt:text
        }
      : {
          mode:"chat",
          message:text,
          history:conversation.slice(0,-1).slice(-6)
        };

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(requestBody)
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Server returned an invalid response.");
    }

    if (!response.ok || data.success === false) {
      throw new Error(data.error || "Server error: " + response.status);
    }

    if (imageMode) {

      if (!data.image) {
        throw new Error("Server did not return an image.");
      }

      addImageMessage(data.image);

      conversation.push({
        role:"assistant",
        content:"[Image generated]"
      });

      saveConversation();
      return;
    }

    const reply = data.reply || data.response || data.text;

    if (!reply || typeof reply !== "string") {
      throw new Error("AI response was empty.");
    }

    conversation.push({
      role:"assistant",
      content:reply
    });

    addMessage("assistant",reply);
    saveConversation();

  } catch(error) {

    console.error("ESUKA AI request error:",error);

    addMessage(
      "assistant",
      (imageMode ? "Image generation failed: " : "Connection problem: ") +
      error.message
    );

  } finally {

    removeTyping();
    sending = false;
    sendBtn.disabled = false;
    input.focus();

  }
}

/* VOICE OUTPUT */

function speakText(text,button) {

  if (!("speechSynthesis" in window)) {
    alert("Voice output is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();

  const cleanText = text.replace(/[*#`_]/g,"");
  const utterance = new SpeechSynthesisUtterance(cleanText);

  const isHindi =
    /[\u0900-\u097F]/.test(cleanText) ||
    /\b(kya|hai|haan|nahi|kaise|mera|tum|aap|mujhe)\b/i.test(cleanText);

  utterance.lang = isHindi ? "hi-IN" : "en-US";
  utterance.rate = 1;
  utterance.pitch = 1.08;

  const preferred = isHindi
    ? ["heera","neerja","swara","female","hindi"]
    : ["samantha","zira","female","aria","jenny"];

  const matching = voices.find(v =>
    preferred.some(p => v.name.toLowerCase().includes(p)) &&
    (
      isHindi
        ? v.lang.toLowerCase().startsWith("hi")
        : v.lang.toLowerCase().startsWith("en")
    )
  );

  const fallback = voices.find(v =>
    v.lang.toLowerCase().startsWith(isHindi ? "hi" : "en")
  );

  if (matching) utterance.voice = matching;
  else if (fallback) utterance.voice = fallback;

  utterance.onend = () => {
    if (button) button.textContent = "🔊 Listen";
  };

  utterance.onerror = () => {
    if (button) button.textContent = "🔊 Listen";
  };

  speechSynthesis.speak(utterance);
}

function stopSpeech() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  document.querySelectorAll(".listen-btn").forEach(b => {
    b.textContent = "🔊 Listen";
  });
}

/* VOICE INPUT */

function toggleMic() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  if (listening) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "●";
  };

  recognition.onresult = event => {

    let result = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      result += event.results[i][0].transcript;
    }

    input.value = result;

    input.style.height = "auto";
    input.style.height =
      Math.min(input.scrollHeight,130) + "px";
  };

  recognition.onerror = event => {
    console.log("Speech error:",event.error);
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎙";
  };

  recognition.start();
}

/* INPUT RESIZE */

input.addEventListener("input",() => {

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,130) + "px";

});

/* ENTER TO SEND */

input.addEventListener("keydown",event => {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

/* INITIALIZE */

renderHistory();

</script>

</body>
</html>
