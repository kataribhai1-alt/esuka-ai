
<script>
"use strict";

/* =========================
   ESUKA AI CONFIGURATION
========================= */

const SUPABASE_URL = "https://tdpiviiihjaiizltoegt.supabase.co";
const SUPABASE_KEY = "sb_publishable_yJjz9rjnsvMV6bW6DGKi2g_bJWY1CSw";
const API_URL = "https://esuka-ai-web.kataribhai1.workers.dev/";

const $ = id => document.getElementById(id);

if (!window.supabase) {
  $("authMessage").textContent =
    "Supabase library load nahi hui. Internet connection check karo.";
  throw new Error("Supabase library unavailable");
}

/* =========================
   SUPABASE CLIENT
========================= */

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: "pkce"
    }
  }
);

/* =========================
   APP VARIABLES
========================= */

let currentUser = null;
let initializedUserId = null;

let settings = {
  language: "Hinglish",
  responseStyle: "Friendly",
  voiceEnabled: false,
  voiceType: "female",
  voiceSpeed: 1,
  theme: "black",
  fontSize: "14"
};

let imageMode = false;
let busy = false;
let currentHistory = [];
let savedChats = [];
let recognition = null;
let listening = false;
let currentChatId = null;
let authMode = "login";

/* =========================
   AUTHENTICATION
========================= */

function authMessage(message) {
  $("authMessage").textContent = message;
}

function switchAuthMode(mode) {
  authMode = mode;

  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", mode === "signup");

  $("emailSubmit").textContent =
    mode === "login" ? "Login" : "Create account";

  $("authPassword").autocomplete =
    mode === "login" ? "current-password" : "new-password";

  authMessage("");
}

$("loginTab").onclick = () => switchAuthMode("login");
$("signupTab").onclick = () => switchAuthMode("signup");

/* EMAIL LOGIN AND SIGNUP */

$("emailSubmit").addEventListener("click", async () => {
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  if (!email || !password) {
    authMessage("Email aur password dono enter karo.");
    return;
  }

  if (password.length < 6) {
    authMessage("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  $("emailSubmit").disabled = true;
  authMessage("Please wait...");

  try {
    if (authMode === "signup") {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password
      });

      if (error) throw error;

      if (data.session) {
        authMessage("Account created. Signing in...");
        await handleLoginSession(data.session);
      } else {
        authMessage(
          "Account created! Email verification link check karo, phir login karo."
        );
      }
    } else {
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      if (data.session) {
        await handleLoginSession(data.session);
      }
    }
  } catch (error) {
    authMessage(error.message || "Authentication failed.");
  } finally {
    $("emailSubmit").disabled = false;
  }
});

/* GOOGLE LOGIN */

$("googleLogin").addEventListener("click", async () => {
  $("googleLogin").disabled = true;
  authMessage("Opening Google sign-in...");

  try {
    const redirectURL = window.location.origin + "/";

    const { data, error } =
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: redirectURL,
          queryParams: {
            prompt: "select_account"
          }
        }
      });

    if (error) throw error;

    if (data?.url) {
      window.location.assign(data.url);
    }
  } catch (error) {
    authMessage(error.message || "Google login failed.");
    $("googleLogin").disabled = false;
  }
});

/* RESTORE USER SESSION */

async function restoreLoginSession() {
  try {
    const params = new URLSearchParams(window.location.search);

    const authError =
      params.get("error_description") ||
      params.get("error");

    if (authError) {
      authMessage("Google login error: " + authError);

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

      return;
    }

    authMessage("Checking login session...");

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session?.user) {
      await handleLoginSession(data.session);
    } else {
      $("authScreen").classList.remove("hidden");
      $("app").classList.add("hidden");
      authMessage("");
    }
  } catch (error) {
    console.error("Session restore error:", error);

    $("authScreen").classList.remove("hidden");
    $("app").classList.add("hidden");

    authMessage(
      error.message || "Session restore failed. Please login again."
    );
  }
}

/* LOGIN SESSION HANDLER */

async function handleLoginSession(session) {
  if (!session?.user) return;

  currentUser = session.user;

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  if (initializedUserId !== currentUser.id) {
    initializedUserId = currentUser.id;
    initializeUser();
  }
}

/* AUTH STATE LISTENER */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {
    if (session?.user) {
      handleLoginSession(session);
    }

    if (event === "SIGNED_OUT") {
      currentUser = null;
      initializedUserId = null;

      currentHistory = [];
      savedChats = [];
      currentChatId = null;

      $("app").classList.add("hidden");
      $("authScreen").classList.remove("hidden");

      $("authEmail").value = "";
      $("authPassword").value = "";

      $("messages").innerHTML = "";
      $("historyList").innerHTML = "";

      switchAuthMode("login");
    }
  }
);

/* START SESSION RESTORE */

restoreLoginSession();

/* LOGOUT */

async function logout() {
  if (!confirm("Are you sure you want to log out?")) return;

  const buttons = [
    $("logoutBtn"),
    $("settingsLogoutBtn")
  ];

  buttons.forEach(button => {
    button.disabled = true;
    button.textContent = "Logging out...";
  });

  stopSpeaking();
  stopListening();

  try {
    const { error } =
      await supabaseClient.auth.signOut({
        scope: "local"
      });

    if (error) throw error;

    currentUser = null;
    initializedUserId = null;

    currentHistory = [];
    savedChats = [];
    currentChatId = null;

    $("messages").innerHTML = "";
    $("historyList").innerHTML = "";

    $("app").classList.add("hidden");
    $("authScreen").classList.remove("hidden");

    $("authEmail").value = "";
    $("authPassword").value = "";

    switchAuthMode("login");
    authMessage("You have been logged out successfully.");

    closeSettings();
    closeSidebar();

  } catch (error) {
    showToast("Logout failed: " + error.message);
  } finally {
    buttons.forEach(button => {
      button.disabled = false;
      button.textContent = "Logout";
    });
  }
}

$("logoutBtn").onclick = logout;
$("settingsLogoutBtn").onclick = logout;

/* =========================
   USER INITIALIZATION
========================= */

function initializeUser() {
  if (!currentUser) return;

  const email = currentUser.email || "ESUKA User";

  $("profileName").textContent = email;
  $("profileAvatar").textContent = email.charAt(0).toUpperCase();
  $("settingsAccount").textContent = email;

  loadData();
}

/* =========================
   STORAGE
========================= */

function chatStorageKey() {
  return "esuka_chats_" + (currentUser?.id || "guest");
}

function settingsStorageKey() {
  return "esuka_settings_" + (currentUser?.id || "guest");
}

function loadData() {
  try {
    settings = {
      ...settings,
      ...JSON.parse(
        localStorage.getItem(settingsStorageKey()) || "{}"
      )
    };
  } catch (error) {}

  try {
    savedChats = JSON.parse(
      localStorage.getItem(chatStorageKey()) || "[]"
    );

    if (!Array.isArray(savedChats)) savedChats = [];
  } catch (error) {
    savedChats = [];
  }

  applySettings();
  renderHistory();
}

function saveSettings() {
  settings = {
    language: $("language").value,
    responseStyle: $("responseStyle").value,
    voiceEnabled: $("voiceToggle").classList.contains("on"),
    voiceType: $("voiceType").value,
    voiceSpeed: Number($("voiceSpeed").value),
    theme: $("themeSelect").value,
    fontSize: $("fontSize").value
  };

  localStorage.setItem(
    settingsStorageKey(),
    JSON.stringify(settings)
  );

  applySettings();
  showToast("Preferences saved");
}

function applySettings() {
  document.body.classList.remove("grey", "light");

  if (settings.theme === "grey") {
    document.body.classList.add("grey");
  }

  if (settings.theme === "light") {
    document.body.classList.add("light");
  }

  document.documentElement.style.setProperty(
    "--chat-font",
    settings.fontSize + "px"
  );

  $("language").value = settings.language;
  $("responseStyle").value = settings.responseStyle;
  $("voiceType").value = settings.voiceType;
  $("voiceSpeed").value = settings.voiceSpeed;

  $("speedValue").textContent =
    Number(settings.voiceSpeed).toFixed(1) + "x";

  $("themeSelect").value = settings.theme;
  $("fontSize").value = settings.fontSize;

  $("voiceToggle").classList.toggle(
    "on",
    !!settings.voiceEnabled
  );

  $("voiceToggle").setAttribute(
    "aria-pressed",
    String(!!settings.voiceEnabled)
  );
}

/* =========================
   TOAST
========================= */

function showToast(message) {
  const toast = $("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2400);
}

/* =========================
   CHAT HISTORY
========================= */

function saveChats() {
  try {
    localStorage.setItem(
      chatStorageKey(),
      JSON.stringify(savedChats.slice(0, 30))
    );
  } catch (error) {
    showToast("Storage full");
  }

  renderHistory();
}

function saveCurrentChat() {
  if (!currentHistory.length) return;

  const first = currentHistory.find(
    message => message.role === "user"
  );

  const item = {
    id: currentChatId || String(Date.now()),
    title: (first?.content || "New Chat").slice(0, 38),
    history: currentHistory,
    date: Date.now()
  };

  const index = savedChats.findIndex(
    chat => chat.id === item.id
  );

  if (index >= 0) {
    savedChats[index] = item;
  } else {
    savedChats.unshift(item);
  }

  currentChatId = item.id;
  saveChats();
}

function renderHistory() {
  $("historyList").innerHTML = "";

  savedChats.slice(0, 20).forEach(chat => {
    const button = document.createElement("div");
    button.className = "history-item";

    const icon = document.createElement("span");
    icon.textContent = "◷";

    const label = document.createElement("span");
    label.textContent = chat.title || "Chat";

    button.append(icon, label);
    button.onclick = () => openChat(chat.id);

    $("historyList").appendChild(button);
  });
}

function openChat(id) {
  const chat = savedChats.find(item => item.id === id);

  if (!chat) return;

  currentChatId = chat.id;

  currentHistory = Array.isArray(chat.history)
    ? chat.history.slice()
    : [];

  renderMessages();
  closeSidebar();
}

function renderMessages() {
  $("welcome").style.display =
    currentHistory.length ? "none" : "block";

  $("messages").innerHTML = "";

  currentHistory.forEach(message => {
    addMessage(message.role, message.content, false);
  });

  scrollBottom();
}

/* =========================
   MESSAGES
========================= */

function addMessage(role, content, save = true) {
  const row = document.createElement("div");

  row.className =
    "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "user" ? "U" : "E";

  const box = document.createElement("div");
  box.className = "msg-content";

  const name = document.createElement("div");
  name.className = "msg-name";
  name.textContent = role === "user" ? "You" : "ESUKA AI";

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = content;

  box.append(name, bubble);

  if (role !== "user") {
    const actions = document.createElement("div");
    actions.className = "msg-actions";

    const copy = document.createElement("button");
    copy.className = "mini-btn";
    copy.textContent = "Copy";
    copy.onclick = () => copyText(content);

    const listen = document.createElement("button");
    listen.className = "mini-btn";
    listen.textContent = "Listen";
    listen.onclick = () => speakText(content, true);

    const stop = document.createElement("button");
    stop.className = "mini-btn";
    stop.textContent = "Stop";
    stop.onclick = stopSpeaking;

    actions.append(copy, listen, stop);
    box.appendChild(actions);
  }

  if (role === "user") {
    row.append(box, avatar);
  } else {
    row.append(avatar, box);
  }

  $("messages").appendChild(row);

  if (save) {
    currentHistory.push({ role, content });

    if (role === "user") {
      $("welcome").style.display = "none";
    }

    saveCurrentChat();
  }

  scrollBottom();

  return row;
}

function addImage(url) {
  const last = $("messages").lastElementChild;

  if (!last) return;

  const box = last.querySelector(".msg-content");

  if (!box) return;

  const image = document.createElement("img");

  image.className = "generated-image";
  image.alt = "Image generated by ESUKA AI";
  image.src = url;

  image.onerror = () => {
    image.remove();
    showToast("Image could not be displayed");
  };

  box.appendChild(image);

  const actions = document.createElement("div");
  actions.className = "image-actions";

  const download = document.createElement("button");
  download.className = "mini-btn";
  download.textContent = "↓ Download image";
  download.onclick = () => downloadImage(url);

  const open = document.createElement("button");
  open.className = "mini-btn";
  open.textContent = "Open image";
  open.onclick = () => window.open(url, "_blank", "noopener");

  actions.append(download, open);
  box.appendChild(actions);

  scrollBottom();
}

function downloadImage(url) {
  const link = document.createElement("a");

  link.href = url;
  link.download = "esuka-ai-image-" + Date.now() + ".png";

  document.body.appendChild(link);
  link.click();
  link.remove();
}

function scrollBottom() {
  $("chatArea").scrollTop = $("chatArea").scrollHeight;
}

/* =========================
   LOADING ANIMATIONS
========================= */

function showTyping() {
  const row = document.createElement("div");

  row.className = "message assistant";
  row.id = "typingRow";

  row.innerHTML =
    '<div class="msg-avatar">E</div>' +
    '<div><div class="msg-name">ESUKA AI</div>' +
    '<div class="msg-bubble">' +
    '<div class="typing"><i></i><i></i><i></i></div>' +
    '<div class="thinking-text">ESUKA is thinking...</div>' +
    '</div></div>';

  $("messages").appendChild(row);
  scrollBottom();
}

function showImageProcessing() {
  const row = document.createElement("div");

  row.className = "message assistant";
  row.id = "typingRow";

  row.innerHTML =
    '<div class="msg-avatar">E</div>' +
    '<div class="msg-content"><div class="msg-name">ESUKA AI</div>' +
    '<div class="image-processing">' +
    '<div class="image-preview-skeleton"></div>' +
    '<div class="image-processing-info">' +
    '<div class="image-spinner"></div>' +
    '<div><div class="image-processing-title">Creating your image</div>' +
    '<div class="image-processing-sub">Preparing and rendering your image...</div>' +
    '</div></div></div></div>';

  $("messages").appendChild(row);
  scrollBottom();
}

function removeTyping() {
  $("typingRow")?.remove();
}

/* =========================
   CHAT MANAGEMENT
========================= */

function newChat() {
  stopSpeaking();
  stopListening();

  currentHistory = [];
  currentChatId = null;

  $("messages").innerHTML = "";
  $("welcome").style.display = "block";

  imageMode = false;
  updateMode();

  $("prompt").value = "";

  closeSidebar();
}

function clearChat() {
  if (!confirm("Clear all saved chat history for this account?")) {
    return;
  }

  savedChats = [];
  currentHistory = [];
  currentChatId = null;

  localStorage.removeItem(chatStorageKey());

  $("messages").innerHTML = "";
  $("welcome").style.display = "block";

  renderHistory();
  showToast("Chat history cleared");
}

/* =========================
   IMAGE MODE
========================= */

function updateMode() {
  $("modeLabel").classList.toggle("show", imageMode);
  $("attachBtn").classList.toggle("active", imageMode);
  $("sideImageBtn").classList.toggle("active", imageMode);
}

function toggleImageMode() {
  imageMode = !imageMode;

  updateMode();

  showToast(
    imageMode ? "Image mode ON" : "Image mode OFF"
  );
}

/* =========================
   SIDEBAR
========================= */

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("backdrop").classList.remove("show");
}

function toggleSidebar() {
  $("sidebar").classList.toggle("open");
  $("backdrop").classList.toggle("show");
}

/* =========================
   AI REQUEST
========================= */

function buildPreferenceMessage(text) {
  return (
    "[User preferences: Reply language: " +
    settings.language +
    "; Response style: " +
    settings.responseStyle +
    ". Follow these preferences naturally.]\n\nUser message: " +
    text
  );
}

function isImageRequest(text) {
  const value = String(text || "").toLowerCase().trim();

  if (
    /\b(how|what|why|where|kaise|kyun)\b.*\b(make|create|generate|draw|bana)\b/i.test(value)
  ) {
    return false;
  }

  const imageWords =
    /\b(photo|image|picture|pic|portrait|wallpaper|poster|logo|drawing|illustration|artwork|thumbnail|tasveer|फोटो|तस्वीर|चित्र)\b/i;

  const createWords =
    /\b(make|create|generate|draw|design|bana|banao|banado|bana do|taiyar karo)\b/i;

  const directDraw =
    /\b(draw|paint|illustrate)\b.*\b(tiger|lion|cat|dog|car|mountain|bird|dragon|house|tree|flower)\b/i;

  return (
    (imageWords.test(value) && createWords.test(value)) ||
    directDraw.test(value)
  );
}

/* SEND MESSAGE */

async function sendMessage() {
  const text = $("prompt").value.trim();

  if (!text || busy) return;

  $("prompt").value = "";
  $("prompt").style.height = "auto";

  addMessage("user", text);

  const useImage = imageMode || isImageRequest(text);

  busy = true;
  $("sendBtn").disabled = true;

  if (useImage) {
    showImageProcessing();
  } else {
    showTyping();
  }

  try {
    const payload = useImage
      ? {
          mode: "image",
          message: text,
          prompt: text
        }
      : {
          message: buildPreferenceMessage(text),
          history: currentHistory.slice(0, -1)
        };

    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      90000
    );

    let response;

    try {
      response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }

    const data = await response.json();

    removeTyping();

    if (!response.ok || data.success === false) {
      throw new Error(
        data.error || data.message || "Server error"
      );
    }

    if (useImage) {
      const image =
        data.image ||
        data.url ||
        data.result?.image ||
        data.result?.url ||
        data.output;

      if (typeof image !== "string" || !image) {
        throw new Error(
          "Image provider did not return an image"
        );
      }

      let url = image;

      if (
        !image.startsWith("data:image/") &&
        !image.startsWith("http")
      ) {
        url = "data:image/png;base64," + image;
      }

      addMessage("assistant", "Your image is ready.");
      addImage(url);

    } else {
      const reply =
        data.reply ||
        data.response ||
        data.text ||
        data.message ||
        data.result?.reply;

      if (!reply) {
        throw new Error("Empty response from AI");
      }

      addMessage("assistant", String(reply));

      if (settings.voiceEnabled) {
        speakText(String(reply), false);
      }
    }

  } catch (error) {
    removeTyping();

    const message =
      error.name === "AbortError"
        ? "Request timed out. Please try again."
        : error.message || "Unknown error";

    addMessage(
      "assistant",
      "Sorry, kuch problem aa gayi: " + message
    );

  } finally {
    busy = false;

    $("sendBtn").disabled = false;

    imageMode = false;
    updateMode();

    $("prompt").focus();
  }
}

/* =========================
   COPY
========================= */

function copyText(text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => showToast("Copied"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement("textarea");

  textarea.value = text;

  document.body.appendChild(textarea);

  textarea.select();

  try {
    document.execCommand("copy");
    showToast("Copied");
  } catch (error) {
    showToast("Copy not available");
  }

  textarea.remove();
}

/* =========================
   AI VOICE OUTPUT
========================= */

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

function speakText(text, manual = false) {
  if (!manual && !settings.voiceEnabled) return;

  if (!("speechSynthesis" in window)) {
    showToast("Voice not supported");
    return;
  }

  stopSpeaking();

  const voices = window.speechSynthesis.getVoices();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.rate = Number(settings.voiceSpeed);

  utterance.lang =
    settings.language === "English" ? "en-IN" : "hi-IN";

  if (settings.voiceType !== "system") {
    const indian = voices.filter(voice =>
      /india|hindi|en-in|hi-in/i.test(
        voice.lang + " " + voice.name
      )
    );

    const pattern =
      settings.voiceType === "female"
        ? /female|woman|heera|priya|neerja/i
        : /male|man|ravi|amit|rahul/i;

    const selected = indian.find(voice =>
      pattern.test(voice.name)
    );

    if (selected) {
      utterance.voice = selected;
    }
  }

  utterance.onerror = () => {
    showToast("Voice playback failed");
  };

  window.speechSynthesis.speak(utterance);
}

/* =========================
   MICROPHONE
========================= */

function setMicRecording(active) {
  $("micBtn").classList.toggle("recording", active);

  $("micBtn").setAttribute(
    "aria-label",
    active ? "Stop voice input" : "Start voice input"
  );

  $("micBtn").title =
    active ? "Stop voice input" : "Voice input";
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showToast("Voice input not supported in this browser");
    return;
  }

  if (listening) {
    stopListening();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang =
    settings.language === "English" ? "en-IN" : "hi-IN";

  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    listening = true;

    $("voicePanel").classList.add("show");

    setMicRecording(true);

    $("voiceStatus").textContent = "Listening...";
  };

  recognition.onresult = event => {
    let transcript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      transcript += event.results[i][0].transcript;
    }

    $("prompt").value = transcript;

    $("prompt").style.height = "auto";

    $("prompt").style.height =
      Math.min($("prompt").scrollHeight, 130) + "px";
  };

  recognition.onerror = event => {
    showToast("Voice input: " + event.error);
  };

  recognition.onend = () => {
    listening = false;

    $("voicePanel").classList.remove("show");

    setMicRecording(false);

    recognition = null;
  };

  try {
    recognition.start();
  } catch (error) {
    showToast("Microphone could not start");
  }
}

function stopListening() {
  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}
  }

  listening = false;

  $("voicePanel").classList.remove("show");

  setMicRecording(false);
}

function toggleVoice() {
  if (listening) {
    stopListening();
  } else {
    startListening();
  }
}

/* =========================
   SETTINGS
========================= */

function toggleVoiceSetting() {
  const enabled =
    $("voiceToggle").classList.toggle("on");

  $("voiceToggle").setAttribute(
    "aria-pressed",
    String(enabled)
  );

  settings.voiceEnabled = enabled;

  if (!enabled) {
    stopSpeaking();
  }

  showToast(
    enabled ? "Automatic voice ON" : "Automatic voice OFF"
  );
}

function resetSettings() {
  if (!confirm("Reset all preferences to default?")) {
    return;
  }

  settings = {
    language: "Hinglish",
    responseStyle: "Friendly",
    voiceEnabled: false,
    voiceType: "female",
    voiceSpeed: 1,
    theme: "black",
    fontSize: "14"
  };

  localStorage.setItem(
    settingsStorageKey(),
    JSON.stringify(settings)
  );

  applySettings();

  stopSpeaking();

  showToast("Settings reset");
}

function cycleTheme() {
  const themes = ["black", "grey", "light"];

  settings.theme =
    themes[(themes.indexOf(settings.theme) + 1) % 3];

  localStorage.setItem(
    settingsStorageKey(),
    JSON.stringify(settings)
  );

  applySettings();

  showToast("Theme: " + settings.theme);
}

function openSettings() {
  $("settingsOverlay").classList.add("show");
}

function closeSettings() {
  $("settingsOverlay").classList.remove("show");
}

/* =========================
   BUTTON EVENTS
========================= */

$("newChatBtn").onclick = newChat;

$("sideImageBtn").onclick = toggleImageMode;
$("attachBtn").onclick = toggleImageMode;

$("sideVoiceBtn").onclick = toggleVoice;
$("micBtn").onclick = toggleVoice;

$("stopVoiceBtn").onclick = stopListening;

$("sendBtn").onclick = sendMessage;

$("clearBtn").onclick = clearChat;

$("historyBtn").onclick = () => {
  renderHistory();
  showToast("Recent chats are in sidebar");
};

$("settingsBtn").onclick = openSettings;
$("topSettingsBtn").onclick = openSettings;

$("closeSettings").onclick = closeSettings;
$("cancelSettings").onclick = closeSettings;

$("saveSettings").onclick = () => {
  saveSettings();
  closeSettings();
};

$("resetSettingsBtn").onclick = resetSettings;
$("settingsClearBtn").onclick = clearChat;

$("voiceToggle").onclick = toggleVoiceSetting;

$("voiceSpeed").oninput = () => {
  $("speedValue").textContent =
    Number($("voiceSpeed").value).toFixed(1) + "x";
};

$("themeBtn").onclick = cycleTheme;

$("aboutBtn").onclick = () => {
  alert("ESUKA AI\nVersion 1.4\nYour AI Assistant");
};

$("menuBtn").onclick = toggleSidebar;
$("backdrop").onclick = closeSidebar;

$("settingsOverlay").onclick = event => {
  if (event.target === $("settingsOverlay")) {
    closeSettings();
  }
};

/* TEXT INPUT */

$("prompt").oninput = event => {
  event.target.style.height = "auto";

  event.target.style.height =
    Math.min(event.target.scrollHeight, 130) + "px";
};

$("prompt").onkeydown = event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
};

/* SUGGESTIONS */

document.querySelectorAll(".suggestion").forEach(button => {
  button.onclick = () => {
    $("prompt").value = button.dataset.prompt;
    $("prompt").focus();
  };
});

/* ESCAPE KEY */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeSettings();
    closeSidebar();
  }
});
</script>
