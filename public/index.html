<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b1b">
<title>ESUKA AI</title>

<style>
:root{
  --bg:#030817;
  --panel:#07142b;
  --blue:#08caff;
  --purple:#713bff;
  --text:#f4f7ff;
  --muted:#91a5c8;
  --border:rgba(91,151,255,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100dvh;
  overflow:hidden;
}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
.app{
  display:flex;
  width:100%;
  height:100dvh;
  background:
    radial-gradient(ellipse at 75% 15%,rgba(21,75,180,.17),transparent 40%),
    radial-gradient(ellipse at 90% 95%,rgba(99,30,255,.15),transparent 38%),
    #030817;
}

/* SIDEBAR */
.sidebar{
  width:270px;
  flex-shrink:0;
  background:rgba(5,14,34,.92);
  border-right:1px solid var(--border);
  padding:24px 17px;
  display:flex;
  flex-direction:column;
  z-index:10;
  transition:transform .3s;
}
.brand{display:flex;align-items:center;gap:13px;margin:0 0 28px 5px}
.logo{
  width:58px;height:58px;
  display:grid;place-items:center;
  font-size:42px;font-weight:900;
  border-radius:17px;
  color:white;
  background:linear-gradient(140deg,#00cfff,#174dff 55%,#842cff);
  box-shadow:0 0 25px #087cff88,inset 0 0 13px #ffffff55;
  text-shadow:0 0 15px white;
  animation:logoGlow 4s infinite alternate;
}
@keyframes logoGlow{
  from{box-shadow:0 0 15px #087cff66}
  to{box-shadow:0 0 35px #713bffbb,0 0 60px #087cff44}
}
.brand h2{font-size:21px;letter-spacing:.4px}
.brand p{font-size:12px;color:var(--muted);margin-top:3px}
.side-btn{
  border:1px solid transparent;
  background:transparent;
  padding:13px 14px;
  border-radius:15px;
  display:flex;align-items:center;gap:12px;
  text-align:left;width:100%;
  margin-bottom:9px;
  color:#dce8ff;
  transition:.25s;
}
.side-btn:hover,.side-btn.active{
  background:linear-gradient(110deg,#0756c8aa,#5522b888);
  border-color:#268dff77;
  box-shadow:0 0 20px #087cff22;
}
.side-icon{font-size:20px;width:25px;text-align:center}
.search{
  width:100%;padding:12px 14px;
  background:#07142b;border:1px solid var(--border);
  border-radius:13px;color:white;outline:none;
  margin:9px 0 20px;
}
.search:focus{border-color:var(--blue)}
.side-label{
  font-size:12px;color:#8299c0;
  margin:5px 8px 12px;
}
.history-list{overflow:auto;flex:1}
.history-item{
  font-size:13px;color:#c5d4ef;
  padding:11px 9px;border-radius:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;
}
.history-item:hover{background:#13264a}
.bottom-side{border-top:1px solid var(--border);padding-top:14px}
.profile{display:flex;align-items:center;gap:10px;padding:12px 5px}
.avatar{
  width:39px;height:39px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,#00caff,#783cff);
}
.profile small{display:block;color:#16dfa2;margin-top:3px}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{
  height:75px;flex-shrink:0;
  display:flex;align-items:center;justify-content:flex-end;
  gap:12px;padding:0 25px;
}
.top-pill{
  background:#09162e;border:1px solid var(--border);
  padding:10px 15px;border-radius:30px;
  font-size:13px;color:#dce9ff;
}
.top-btn{
  width:40px;height:40px;border-radius:50%;
  background:#0a1730;border:1px solid var(--border);
  font-size:18px;transition:.25s;
}
.top-btn:hover{border-color:var(--blue);box-shadow:0 0 15px #087cff66}
.mobile-menu{display:none;margin-right:auto}

/* CHAT AREA */
.chat-area{
  flex:1;min-height:0;overflow-y:auto;
  padding:15px 25px 25px;
  scroll-behavior:smooth;
}
.welcome{
  min-height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:15px 0 35px;
}
.orb-wrap{
  width:165px;height:165px;
  position:relative;display:grid;place-items:center;
  margin-bottom:30px;
}
.orb{
  width:135px;height:135px;border-radius:50%;
  display:grid;place-items:center;
  font-size:91px;font-weight:900;
  color:#fff;
  background:
    radial-gradient(circle at 30% 20%,#a8f4ff,#147bff 35%,#2514a5 70%,#080d39);
  border:2px solid #7ee9ff;
  box-shadow:0 0 22px #00bfff,0 0 55px #334bff99,inset 0 0 20px #ffffff77;
  text-shadow:0 0 18px white;
  animation:orbFloat 4s ease-in-out infinite;
  z-index:2;
}
.orbit{
  position:absolute;width:170px;height:62px;
  border:2px solid transparent;
  border-top-color:#00d9ff;
  border-bottom-color:#753bff;
  border-radius:50%;
  transform:rotate(-27deg);
  filter:drop-shadow(0 0 8px #00caff);
  animation:orbitSpin 7s linear infinite;
}
.orbit.two{
  width:185px;height:72px;
  transform:rotate(48deg);
  border-top-color:#874cff;
  border-bottom-color:#00caff;
  animation-direction:reverse;
  animation-duration:10s;
}
@keyframes orbFloat{50%{transform:translateY(-9px) scale(1.035)}}
@keyframes orbitSpin{to{rotate:360deg}}
.welcome h1{font-size:clamp(27px,4vw,42px);text-align:center}
.gradient-text{
  background:linear-gradient(90deg,#00d9ff,#6c80ff,#c05aff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome .subtitle{
  color:#a9bddf;text-align:center;
  font-size:17px;margin-top:12px;
}
.sparkle{color:#25caff;margin:20px 0;font-size:23px}
.feature-grid{
  display:grid;grid-template-columns:repeat(4,minmax(125px,1fr));
  gap:13px;width:min(850px,100%);margin-top:15px;
}
.feature{
  padding:19px 10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#0d2145aa,#090e25dd);
  text-align:center;transition:.25s;
}
.feature:hover{
  transform:translateY(-5px);
  border-color:#168cff;
  box-shadow:0 0 25px #087cff33;
}
.feature .f-icon{font-size:29px;margin-bottom:10px}
.feature b{font-size:14px;display:block}
.feature small{display:block;color:var(--muted);margin-top:5px;font-size:12px}

/* MESSAGES */
.messages{width:min(850px,100%);margin:0 auto}
.message-row{display:flex;margin:20px 0;gap:11px;animation:messageIn .35s ease both}
.message-row.user{justify-content:flex-end}
.message-avatar{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#00bfff,#5b36ff);
  font-weight:800;
}
.message-content{max-width:85%;min-width:0}
.message-name{font-size:12px;color:#8ea8d3;margin:0 0 7px 3px}
.bubble{
  padding:14px 17px;border-radius:17px;
  line-height:1.65;font-size:15px;
  overflow-wrap:anywhere;white-space:pre-wrap;
}
.ai-bubble{
  background:linear-gradient(135deg,#0c1c39,#0a1129);
  border:1px solid var(--border);
  border-top-left-radius:5px;
}
.user-bubble{
  background:linear-gradient(120deg,#124bb0,#5528a9);
  border:1px solid #548dff66;
  border-top-right-radius:5px;
}
@keyframes messageIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.message-actions{display:flex;gap:12px;margin:8px 3px}
.message-actions button{
  background:none;border:0;color:#8ca7d1;font-size:12px;
}
.message-actions button:hover{color:white}
.generated-image{
  display:block;max-width:100%;max-height:500px;
  border-radius:16px;margin-top:10px;
  border:1px solid #278cff66;
  box-shadow:0 0 25px #087cff22;
}

/* THINKING */
.thinking{
  display:flex;align-items:center;gap:13px;
  padding:13px 16px;border:1px solid var(--border);
  background:#09172e;border-radius:16px;width:fit-content;
  animation:messageIn .3s;
}
.think-orb{
  width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#a8ffff,#168bff 50%,#622cff);
  box-shadow:0 0 16px #00aaff;
  animation:thinkPulse 1.2s infinite;
}
@keyframes thinkPulse{
  50%{transform:scale(.78);box-shadow:0 0 30px #7b40ff}
}
.think-text{font-size:13px;color:#c7d8f5}
.dots span{animation:dot 1.2s infinite;opacity:.2}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:1}}

/* IMAGE LOADER */
.image-loader{
  width:min(340px,90%);padding:25px;
  border-radius:22px;text-align:center;
  background:linear-gradient(145deg,#0b1e42,#100d35);
  border:1px solid #427cff66;
  box-shadow:0 0 35px #3d4cff22;
}
.image-loader .loader-orb{
  width:95px;height:95px;border-radius:50%;
  margin:0 auto 20px;
  border:3px solid transparent;
  border-top-color:#00d9ff;
  border-right-color:#813bff;
  background:radial-gradient(circle,#194d9d,#080d2b);
  box-shadow:0 0 25px #087cff;
  animation:spin 1.5s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-track{
  height:5px;background:#19294b;border-radius:10px;
  margin-top:18px;overflow:hidden;
}
.progress-bar{
  height:100%;width:35%;
  background:linear-gradient(90deg,#00d9ff,#883dff);
  border-radius:10px;animation:progress 2s ease-in-out infinite alternate;
}
@keyframes progress{to{width:92%}}

/* COMPOSER */
.composer-wrap{
  padding:10px 25px 22px;
  width:100%;flex-shrink:0;
}
.composer{
  width:min(900px,100%);margin:auto;
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;
  background:rgba(5,14,34,.94);
  border:1px solid #2368cf88;
  border-radius:28px;
  box-shadow:0 0 22px #075bff22,inset 0 0 15px #102b5511;
  transition:.25s;
}
.composer:focus-within{
  border-color:#00bfff;
  box-shadow:0 0 25px #087cff44;
}
.tool-btn{
  width:43px;height:43px;flex-shrink:0;
  border-radius:50%;
  border:1px solid #4265a655;
  background:linear-gradient(145deg,#10264e,#080f25);
  font-size:19px;
  transition:.2s;
}
.tool-btn:hover,.tool-btn.active{
  border-color:#00caff;
  box-shadow:0 0 18px #008cff66;
  transform:scale(1.06);
}
#messageInput{
  flex:1;min-width:0;
  background:transparent;border:0;outline:none;
  color:white;font-size:15px;
  padding:12px 5px;
}
#messageInput::placeholder{color:#8396b8}
.send-btn{
  width:52px;height:52px;flex-shrink:0;
  border-radius:50%;border:1px solid #6acbff;
  background:linear-gradient(135deg,#00bfff,#245dff 55%,#842fff);
  box-shadow:0 0 18px #087cff99;
  font-size:24px;font-weight:800;
  transition:.2s;
}
.send-btn:hover{transform:scale(1.08);box-shadow:0 0 30px #168dff}
.send-btn:active{transform:scale(.94)}
.mode-label{
  display:none;text-align:center;color:#59d8ff;
  font-size:12px;padding:0 0 8px;
}
.mode-label.show{display:block}

/* RIGHT VOICE PANEL */
.voice-panel{
  position:absolute;right:15px;top:38%;
  display:flex;flex-direction:column;gap:5px;
  padding:10px 8px;
  border-radius:24px;
  border:1px solid #2464bb88;
  background:rgba(8,20,48,.85);
  box-shadow:0 0 22px #1655ff22;
  z-index:3;
}
.voice-panel button{
  background:transparent;border:0;
  padding:9px 8px;border-radius:15px;
  color:#c9dcff;font-size:12px;
}
.voice-panel button span{display:block;font-size:22px;margin-bottom:4px}
.voice-panel button:hover{background:#163a78}
.voice-panel .voice-active{color:#00d9ff;text-shadow:0 0 12px #00caff}

/* WAVEFORM */
.wave{
  display:flex;align-items:center;justify-content:center;
  gap:4px;height:30px;margin-top:7px;
}
.wave i{
  width:3px;height:7px;border-radius:5px;
  background:linear-gradient(#00e5ff,#854bff);
}
.wave.playing i{animation:wave .7s ease-in-out infinite alternate}
.wave i:nth-child(2n){animation-delay:.2s}
.wave i:nth-child(3n){animation-delay:.4s}
@keyframes wave{to{height:27px}}

/* MOBILE */
@media(max-width:800px){
  .sidebar{
    position:absolute;left:0;top:0;bottom:0;
    width:275px;transform:translateX(-105%);
    box-shadow:15px 0 40px #0009;
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:block}
  .topbar{height:62px;padding:0 13px;gap:8px}
  .top-pill{font-size:11px;padding:9px}
  .chat-area{padding:10px 13px 15px}
  .welcome{padding:20px 0}
  .orb-wrap{transform:scale(.83);margin-bottom:5px}
  .welcome h1{font-size:28px}
  .welcome .subtitle{font-size:14px}
  .feature-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .feature{padding:15px 7px}
  .feature b{font-size:13px}
  .voice-panel{display:none}
  .composer-wrap{padding:8px 10px 13px}
  .composer{gap:5px;padding:7px}
  .tool-btn{width:37px;height:37px;font-size:16px}
  .send-btn{width:43px;height:43px}
  #messageInput{font-size:14px}
  .bubble{font-size:14px}
}
@media(max-width:380px){
  .top-pill{display:none}
  .feature .f-icon{font-size:24px}
  .tool-btn{width:33px;height:33px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">E</div>
    <div>
      <h2>ESUKA AI</h2>
      <p>Simple • Smart • Powerful</p>
    </div>
  </div>

  <button class="side-btn active" id="newChatBtn">
    <span class="side-icon">▣</span> New Chat
    <span style="margin-left:auto">✦</span>
  </button>

  <input class="search" id="searchChats" placeholder="⌕  Search chats...">

  <div class="side-label">◷ &nbsp; Recent Chats</div>
  <div class="history-list" id="historyList"></div>

  <div class="bottom-side">
    <button class="side-btn" id="premiumBtn"><span class="side-icon">♛</span> Premium Plan</button>
    <button class="side-btn" id="settingsBtn"><span class="side-icon">⚙</span> Settings</button>
    <button class="side-btn" id="aboutBtn"><span class="side-icon">ⓘ</span> About ESUKA AI</button>
    <div class="profile">
      <div class="avatar">K</div>
      <div><b>Katari</b><small>● Online</small></div>
    </div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="top-btn mobile-menu" id="menuBtn">☰</button>
    <div class="top-pill">🔵 Model: ESUKA AI</div>
    <button class="top-pill" id="upgradeBtn">♛ Upgrade</button>
    <button class="top-btn" id="themeBtn" title="Theme">☾</button>
    <button class="top-btn" id="fullScreenBtn" title="Fullscreen">⛶</button>
  </header>

  <section class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="orb-wrap">
        <div class="orbit"></div>
        <div class="orbit two"></div>
        <div class="orb">E</div>
      </div>
      <h1>Welcome to <span class="gradient-text">ESUKA AI</span></h1>
      <p class="subtitle">Your intelligent companion, always here to help.</p>
      <div class="sparkle">✦ ─── ✧ ─── ✦</div>

      <div class="feature-grid">
        <button class="feature" data-prompt="Tell me something interesting">
          <div class="f-icon">⚡</div>
          <b>Get Answers</b><small>Instantly</small>
        </button>
        <button class="feature" data-mode="image">
          <div class="f-icon">▧</div>
          <b>Generate Images</b><small>Unleash Creativity</small>
        </button>
        <button class="feature" data-prompt="Help me write some code">
          <div class="f-icon">‹/›</div>
          <b>Write Code</b><small>Be Productive</small>
        </button>
        <button class="feature" data-prompt="Give me some creative ideas">
          <div class="f-icon">♧</div>
          <b>Explore More</b><small>Discover Ideas</small>
        </button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </section>

  <div class="voice-panel">
    <button id="listenBtn"><span>♬</span>Listen</button>
    <button id="stopBtn"><span>■</span>Stop</button>
    <button id="panelImageBtn"><span>▧</span>Image</button>
    <button id="panelVoiceBtn"><span>🎙</span>Voice</button>
  </div>

  <footer class="composer-wrap">
    <div class="mode-label" id="modeLabel">✦ Image generation mode is ON</div>
    <div class="composer">
      <button class="tool-btn" id="attachBtn" title="More">＋</button>
      <input id="messageInput" type="text" placeholder="Message ESUKA AI..." autocomplete="off">
      <button class="tool-btn" id="micBtn" title="Voice input">🎙</button>
      <button class="tool-btn" id="imageBtn" title="Image generation">▧</button>
      <button class="send-btn" id="sendBtn" title="Send">➤</button>
    </div>
  </footer>
</main>
</div>

<script>
/* ESUKA AI FRONTEND CONFIG */
const API_URL = "https://esuka-ai-web.kataribhai1.workers.dev/";

const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const chatArea = document.getElementById("chatArea");
const modeLabel = document.getElementById("modeLabel");
const sidebar = document.getElementById("sidebar");

let imageMode = false;
let busy = false;
let lastReply = "";
let currentHistory = [];
let chats = [];
let recognition = null;
let currentSpeech = null;

try{
  chats = JSON.parse(localStorage.getItem("esuka_chats") || "[]");
  if(!Array.isArray(chats)) chats=[];
}catch(e){chats=[]}

function saveChats(){
  try{localStorage.setItem("esuka_chats",JSON.stringify(chats.slice(-30)))}catch(e){}
}

function scrollBottom(){
  chatArea.scrollTo({top:chatArea.scrollHeight,behavior:"smooth"});
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showWelcome(show){
  welcome.style.display=show?"flex":"none";
}

function renderHistory(){
  const list=document.getElementById("historyList");
  list.innerHTML="";
  chats.slice().reverse().forEach((chat,index)=>{
    const item=document.createElement("div");
    item.className="history-item";
    item.textContent="◉  "+(chat.title||"New Chat");
    item.addEventListener("click",()=>loadChat(chats.length-1-index));
    list.appendChild(item);
  });
}

function startNewChat(){
  if(busy)return;
  messages.innerHTML="";
  currentHistory=[];
  lastReply="";
  showWelcome(true);
  imageMode=false;
  updateMode();
  input.value="";
  sidebar.classList.remove("open");
  input.focus();
}

function loadChat(index){
  const chat=chats[index];
  if(!chat)return;
  messages.innerHTML="";
  currentHistory=chat.history||[];
  showWelcome(false);
  currentHistory.forEach((m)=>{
    addMessage(m.role==="user"?"user":"ai",m.content,false);
  });
  sidebar.classList.remove("open");
  scrollBottom();
}

function updateMode(){
  imageMode=!imageMode?false:true;
  modeLabel.classList.toggle("show",imageMode);
  document.getElementById("imageBtn").classList.toggle("active",imageMode);
}

function addMessage(role,text,animate=true){
  showWelcome(false);
  const row=document.createElement("div");
  row.className="message-row "+(role==="user"?"user":"ai");

  if(role==="ai"){
    const avatar=document.createElement("div");
    avatar.className="message-avatar";
    avatar.textContent="E";
    row.appendChild(avatar);
  }

  const content=document.createElement("div");
  content.className="message-content";

  const name=document.createElement("div");
  name.className="message-name";
  name.textContent=role==="user"?"You":"ESUKA AI";

  const bubble=document.createElement("div");
  bubble.className="bubble "+(role==="user"?"user-bubble":"ai-bubble");
  bubble.textContent=text;

  content.appendChild(name);
  content.appendChild(bubble);

  if(role==="ai"){
    const actions=document.createElement("div");
    actions.className="message-actions";
    const copy=document.createElement("button");
    copy.textContent="Copy";
    copy.onclick=()=>copyText(text);
    const speak=document.createElement("button");
    speak.textContent="🔊 Listen";
    speak.onclick=()=>speakText(text);
    actions.append(copy,speak);
    content.appendChild(actions);
  }

  row.appendChild(content);
  messages.appendChild(row);
  if(animate)scrollBottom();
  return {row,bubble,content};
}

function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast("Copied"));
  }else{
    const t=document.createElement("textarea");
    t.value=text;document.body.appendChild(t);
    t.select();document.execCommand("copy");t.remove();
    showToast("Copied");
  }
}

function showToast(text){
  let toast=document.getElementById("esukaToast");
  if(!toast){
    toast=document.createElement("div");
    toast.id="esukaToast";
    toast.style.cssText="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#123365;border:1px solid #328cff;padding:11px 19px;border-radius:20px;z-index:99;font-size:13px";
    document.body.appendChild(toast);
  }
  toast.textContent=text;
  toast.style.display="block";
  clearTimeout(toast._timer);
  toast._timer=setTimeout(()=>toast.style.display="none",1800);
}

let thinkTimer=null;
let thinkIndex=0;
const thinkWords=[
  "ESUKA is thinking",
  "Understanding your message",
  "Preparing your answer",
  "Almost ready"
];

function showThinking(){
  const row=document.createElement("div");
  row.className="message-row ai";
  row.id="thinkingRow";
  row.innerHTML=`
    <div class="message-avatar">E</div>
    <div class="thinking">
      <div class="think-orb"></div>
      <div class="think-text"><span id="thinkWord">ESUKA is thinking</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
      <div class="wave playing">${"<i></i>".repeat(12)}</div></div>
    </div>`;
  messages.appendChild(row);
  thinkIndex=0;
  thinkTimer=setInterval(()=>{
    thinkIndex=(thinkIndex+1)%thinkWords.length;
    const word=document.getElementById("thinkWord");
    if(word)word.textContent=thinkWords[thinkIndex];
  },1900);
  scrollBottom();
  return row;
}

function removeThinking(){
  clearInterval(thinkTimer);
  document.getElementById("thinkingRow")?.remove();
}

async function revealText(element,text){
  element.textContent="";
  const chars=Array.from(String(text||""));
  const step=chars.length>1500?12:chars.length>500?5:2;
  for(let i=0;i<chars.length;i+=step){
    element.textContent+=chars.slice(i,i+step).join("");
    if(i%40===0)scrollBottom();
    await new Promise(resolve=>setTimeout(resolve,12));
  }
  scrollBottom();
}

function getReply(data){
  if(typeof data==="string")return data;
  return data?.reply || data?.response || data?.text ||
    data?.message || data?.result?.reply || "I couldn't find a response. Please try again.";
}

function getImage(data){
  if(!data)return null;
  let image=data.image||data.url||data.result?.image||data.result?.url||data.output;
  if(Array.isArray(image))image=image[0];
  if(image&&typeof image==="object"){
    image=image.url||image.image||image.data;
  }
  if(typeof image!=="string")return null;
  if(image.startsWith("http")||image.startsWith("data:image/"))return image;
  if(image.length>1000)return "data:image/png;base64,"+image;
  return null;
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text||busy)return;

  const mode=imageMode?"image":"chat";
  input.value="";
  busy=true;
  sendBtn.disabled=true;
  sendBtn.style.opacity=".55";

  addMessage("user",text);
  currentHistory.push({role:"user",content:text});

  const thinking=showThinking();
  let loader=null;

  if(mode==="image"){
    thinking.remove();
    clearInterval(thinkTimer);
    loader=document.createElement("div");
    loader.className="message-row ai";
    loader.innerHTML=`
      <div class="message-avatar">E</div>
      <div class="image-loader">
        <div class="loader-orb"></div>
        <b>Creating your image</b>
        <p style="color:#9eb6dc;font-size:13px;margin-top:8px">ESUKA is bringing your idea to life...</p>
        <div class="progress-track"><div class="progress-bar"></div></div>
      </div>`;
    messages.appendChild(loader);
    scrollBottom();
  }

  try{
    const payload=mode==="image"
      ?{mode:"image",message:text,prompt:text,history:currentHistory}
      :{message:text,history:currentHistory.slice(0,-1)};

    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const raw=await response.text();
    let data;
    try{data=JSON.parse(raw)}catch(e){throw new Error("Server returned an invalid response.")}

    if(!response.ok || data.success===false){
      throw new Error(data.error||data.message||"Server error: "+response.status);
    }

    removeThinking();
    if(loader)loader.remove();

    if(mode==="image"){
      const imageUrl=getImage(data);
      if(imageUrl){
        const result=addMessage("ai","Your image is ready! ✨");
        const img=document.createElement("img");
        img.className="generated-image";
        img.src=imageUrl;
        img.alt="Generated by ESUKA AI";
        img.onload=scrollBottom;
        result.bubble.appendChild(img);
        lastReply="Your image is ready!";
        currentHistory.push({role:"assistant",content:"Your image is ready!"});
      }else{
        const reply=getReply(data);
        const result=addMessage("ai","");
        await revealText(result.bubble,reply);
        lastReply=reply;
        currentHistory.push({role:"assistant",content:reply});
      }
    }else{
      const reply=getReply(data);
      const result=addMessage("ai","");
      await revealText(result.bubble,reply);
      lastReply=reply;
      currentHistory.push({role:"assistant",content:reply});
    }

    if(!chats.length || !chats[chats.length-1].history ||
       chats[chats.length-1].history!==currentHistory){
      chats.push({title:text.slice(0,38),history:currentHistory});
    }
    saveChats();
    renderHistory();

  }catch(error){
    removeThinking();
    loader?.remove();
    const result=addMessage("ai","Sorry, kuch problem aa gayi: "+error.message);
    lastReply="Sorry, kuch problem aa gayi: "+error.message;
  }finally{
    busy=false;
    sendBtn.disabled=false;
    sendBtn.style.opacity="1";
    imageMode=false;
    updateMode();
    input.focus();
  }
}

/* VOICE OUTPUT */
function speakText(text){
  if(!("speechSynthesis" in window)){
    showToast("Voice playback is not supported in this browser");
    return;
  }
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="hi-IN";
  utterance.rate=1;
  utterance.pitch=1.05;
  const voices=speechSynthesis.getVoices();
  const hindiVoice=voices.find(v=>v.lang.toLowerCase().includes("hi"));
  if(hindiVoice)utterance.voice=hindiVoice;
  currentSpeech=utterance;
  utterance.onstart=()=>{
    document.querySelectorAll(".voice-panel button").forEach(b=>b.classList.remove("voice-active"));
    document.getElementById("listenBtn").classList.add("voice-active");
  };
  utterance.onend=()=>{
    document.getElementById("listenBtn").classList.remove("voice-active");
  };
  speechSynthesis.speak(utterance);
}

/* VOICE INPUT */
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.lang="hi-IN";
  recognition.continuous=false;
  recognition.interimResults=true;

  recognition.onstart=()=>{
    document.getElementById("micBtn").classList.add("active");
    input.placeholder="Listening...";
  };
  recognition.onresult=(event)=>{
    let transcript="";
    for(let i=event.resultIndex;i<event.results.length;i++){
      transcript+=event.results[i][0].transcript;
    }
    input.value=transcript;
  };
  recognition.onerror=()=>{
    showToast("Voice input unavailable. Check microphone permission.");
  };
  recognition.onend=()=>{
    document.getElementById("micBtn").classList.remove("active");
    input.placeholder="Message ESUKA AI...";
  };
}

/* EVENTS */
sendBtn.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();sendMessage();
  }
});

};
document.getElementById("micBtn").onclick=()=>{
  if(!recognition){
    showToast("Voice input is not supported in this browser");
    return;
  }
  try{
    if(document.getElementById("micBtn").classList.contains("active")){
      recognition.stop();
    }else recognition.start();
  }catch(e){showToast("Microphone is busy. Try again.")}
};
document.getElementById("panelVoiceBtn").onclick=()=>{
  if(recognition){
    try{recognition.start()}catch(e){showToast("Microphone is busy")}
  }else showToast("Voice input not supported");
};
document.getElementById("listenBtn").onclick=()=>{
  if(lastReply)speakText(lastReply);
  else showToast("No ESUKA reply to play yet");
};
document.getElementById("stopBtn").onclick=()=>{
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(recognition)try{recognition.stop()}catch(e){}
  document.getElementById("listenBtn").classList.remove("voice-active");
  showToast("Voice stopped");
};

  showToast("ESUKA AI • Your intelligent companion");

  card.addEventListener("click",()=>{

document.getElementById("searchChats").addEventListener("input",e=>{
  const query=e.target.value.toLowerCase();

renderHistory();
