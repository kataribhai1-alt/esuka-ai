
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ESUKA AI Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 padding:20px
}
.login{
 width:100%;max-width:390px;background:#111;
 border:1px solid #292929;border-radius:22px;
 padding:30px 24px;text-align:center
}
.logo{font-size:32px;font-weight:800;letter-spacing:3px}
.sub{color:#999;font-size:14px;margin:10px 0 28px}
input,button{
 width:100%;padding:15px;border-radius:12px;
 margin:7px 0;font-size:15px
}
input{background:#080808;border:1px solid #333;color:white}
button{border:0;font-weight:600;cursor:pointer}
.primary{background:white;color:black}
.secondary{background:#202020;color:white;border:1px solid #333}
.note{color:#888;font-size:12px;margin-top:18px}
#status{font-size:13px;color:#aaa;margin-top:12px}
</style>
</head>
<body>
<div class="login">
 <div class="logo">ESUKA AI</div>
 <div class="sub">Your AI. Your world.</div>

 <input id="email" type="email" placeholder="Email address">
 <input id="password" type="password" placeholder="Password">

 <button class="primary" onclick="signIn()">Login</button>
 <button class="secondary" onclick="signUp()">Create Account</button>
 <button class="secondary" onclick="googleLogin()">Continue with Google</button>
 <button class="secondary" onclick="appleLogin()">Continue with Apple</button>

 <div id="status"></div>
 <div class="note">Secure authentication powered by Supabase</div>
</div>

<script>
const SUPABASE_URL="https://tdpiviiihjaiizltoegt.supabase.co";
const SUPABASE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient=supabase.createClient(
 SUPABASE_URL,SUPABASE_KEY
);

const statusBox=document.getElementById("status");

function status(message){
 statusBox.textContent=message;
}

async function signIn(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password)return status("Email aur password enter karo.");

 const {error}=await supabaseClient.auth.signInWithPassword({
  email,password
 });
 if(error)return status(error.message);
 status("Login successful!");
}

async function signUp(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password)return status("Email aur password enter karo.");
 if(password.length<8)return status("Password kam se kam 8 characters ka rakho.");

 const {error}=await supabaseClient.auth.signUp({
  email,password,
  options:{
   emailRedirectTo:window.location.origin
  }
 });
 if(error)return status(error.message);
 status("Signup successful! Email confirmation check karo.");
}

async function googleLogin(){
 const {error}=await supabaseClient.auth.signInWithOAuth({
  provider:"google",
  options:{redirectTo:window.location.origin}
 });
 if(error)status(error.message);
}

async function appleLogin(){
 const {error}=await supabaseClient.auth.signInWithOAuth({
  provider:"apple",
  options:{redirectTo:window.location.origin}
 });
 if(error)status(error.message);
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(session){
  status("Logged in: "+session.user.email);
  // Connect your existing ESUKA AI chat screen here.
 }
});
</script>
</body>
</html>
