
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESUKA AI | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial,sans-serif;padding:20px}
.container{max-width:850px;margin:35px auto}
.panel{background:#111827;border:1px solid #263449;border-radius:18px;padding:24px;margin-bottom:18px}
h1{color:#8b9cff}
p{color:#aab5c8;line-height:1.5}
button{padding:13px 18px;border:0;border-radius:9px;background:#6578ff;color:white;font-weight:bold;cursor:pointer;margin:6px 4px 6px 0}
.stat{font-size:38px;font-weight:bold;margin:12px 0;color:#8b9cff}
.hidden{display:none}
#status{overflow-wrap:anywhere;margin-top:15px}
</style>
</head>
<body>
<div class="container">
 <div class="panel">
  <h1>ESUKA AI</h1>
  <p>Secure Admin Dashboard</p>
  <div id="login">
   <p>Login with your authorized Google account.</p>
   <button id="googleBtn">Continue with Google</button>
  </div>
  <div id="dashboard" class="hidden">
   <h2>Welcome, Admin!</h2>
   <p id="email"></p>
   <button id="refreshBtn">Refresh Dashboard</button>
   <button id="logoutBtn">Logout</button>
  </div>
  <div id="status">Checking login...</div>
 </div>

 <div id="statsPanel" class="panel hidden">
  <h2>Dashboard Statistics</h2>
  <p>Total Registered Users</p>
  <div class="stat" id="totalUsers">--</div>
  <p id="statsStatus">Waiting for data...</p>
 </div>
</div>

<script>
const SUPABASE_URL="https://tdpiviiihjaiizltoegt.supabase.co";
const SUPABASE_KEY="sb_publishable_yJjz9rjnsvMV6bW6DGKi2g_bJWY1CSw";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const login=document.getElementById("login");
const dashboard=document.getElementById("dashboard");
const statsPanel=document.getElementById("statsPanel");
const statusBox=document.getElementById("status");
const statsStatus=document.getElementById("statsStatus");

let checking=false;

async function loadStats(){
 statsStatus.textContent="Loading user statistics...";
 document.getElementById("totalUsers").textContent="--";

 const {data,error}=await db.functions.invoke("admin-stats");

 if(error){
  statsStatus.textContent="Could not load statistics: "+error.message;
  return;
 }

 if(!data || !data.success){
  statsStatus.textContent=data?.error || "Statistics unavailable.";
  return;
 }

 document.getElementById("totalUsers").textContent=data.totalUsers;
 statsStatus.textContent="Statistics updated successfully.";
}

async function checkAdmin(){
 if(checking)return;
 checking=true;

 login.classList.add("hidden");
 dashboard.classList.add("hidden");
 statsPanel.classList.add("hidden");
 statusBox.textContent="Checking account...";

 try{
  const {data:{session},error}=await db.auth.getSession();
  if(error)throw error;

  if(!session){
   statusBox.textContent="Please login with Google.";
   login.classList.remove("hidden");
   return;
  }

  const {data,error:adminError}=await db
   .from("admin_users")
   .select("user_id")
   .eq("user_id",session.user.id)
   .maybeSingle();

  if(adminError)throw adminError;

  if(!data){
   statusBox.textContent="Access denied. This account is not an admin.";
   login.classList.remove("hidden");
   return;
  }

  document.getElementById("email").textContent=session.user.email;
  statusBox.textContent="Admin access verified successfully.";
  dashboard.classList.remove("hidden");
  statsPanel.classList.remove("hidden");

  await loadStats();

 }catch(error){
  statusBox.textContent="Error: "+error.message;
  login.classList.remove("hidden");
 }finally{
  checking=false;
 }
}

document.getElementById("googleBtn").onclick=async()=>{
 statusBox.textContent="Opening Google login...";
 const {error}=await db.auth.signInWithOAuth({
  provider:"google",
  options:{redirectTo:window.location.href}
 });
 if(error)statusBox.textContent=error.message;
};

document.getElementById("refreshBtn").onclick=loadStats;

document.getElementById("logoutBtn").onclick=async()=>{
 await db.auth.signOut();
 await checkAdmin();
};

db.auth.onAuthStateChange((event)=>{
 if(event==="SIGNED_IN" || event==="SIGNED_OUT"){
  setTimeout(checkAdmin,0);
 }
});

checkAdmin();
</script>
</body>
</html>
