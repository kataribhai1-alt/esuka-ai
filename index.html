
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>ESUKA AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b12;color:#f5f7ff;
 font-family:Arial,sans-serif;height:100vh;overflow:hidden
}
.app{display:flex;height:100vh}
.sidebar{
 width:260px;background:#0d121d;border-right:1px solid #202a3b;
 padding:20px;display:flex;flex-direction:column
}
.logo{font-size:25px;font-weight:bold;color:#8b9cff;margin-bottom:30px}
.newchat{
 background:#192338;color:white;border:1px solid #34435e;
 padding:13px;border-radius:12px;cursor:pointer
}
.sidebottom{margin-top:auto;color:#78869d;font-size:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{
 height:65px;border-bottom:1px solid #202a3b;
 display:flex;align-items:center;padding:0 22px;
 font-weight:bold;font-size:17px
}
.status{margin-left:auto;font-size:12px;color:#65dba2}
.messages{
 flex:1;overflow-y:auto;padding:25px 15px;
 display:flex;flex-direction:column;gap:20px
}
.welcome{text-align:center;margin:auto;max-width:550px}
.welcome h1{font-size:36px;margin-bottom:10px}
.welcome p{color:#8995aa}
.message{
 max-width:800px;width:fit-content;padding:14px 17px;
 border-radius:16px;line-height:1.6;white-space:pre-wrap;
 overflow-wrap:anywhere
}
.user{background:#202d48;align-self:flex-end}
.bot{background:#121b2b;border:1px solid #25334a;align-self:flex-start}
.error{color:#ff9c9c;border-color:#713c47}
.inputarea{padding:15px 18px 22px}
.inputbox{
 max-width:850px;margin:auto;display:flex;gap:10px;
 background:#111a29;border:1px solid #34435a;
 border-radius:17px;padding:9px
}
input{
 flex:1;min-width:0;background:transparent;border:0;
 outline:none;color:white;font-size:16px;padding:10px
}
button{
 background:#788cff;border:0;color:#081020;
 font-weight:bold;border-radius:12px;padding:0 20px;
 cursor:pointer
}
button:disabled{opacity:.5}
.note{text-align:center;color:#68758a;font-size:11px;margin-top:10px}
@media(max-width:650px){
 .sidebar{display:none}
 .top{height:55px}
 .messages{padding:18px 12px}
 .inputarea{padding:10px}
 .welcome h1{font-size:29px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
 <div class="logo">✦ ESUKA AI</div>
 <button class="newchat" id="newChat">＋ New Chat</button>
 <div class="sidebottom">ESUKA AI · Your AI Assistant<br>Powered by Gemini</div>
</aside>

<main class="main">
 <header class="top">
  ✦ ESUKA AI
  <span class="status">● Online</span>
 </header>

 <section class="messages" id="messages">
  <div class="welcome" id="welcome">
   <h1>Welcome to ESUKA AI</h1>
   <p>Your personal AI assistant. Ask anything.</p>
  </div>
 </section>

 <footer class="inputarea">
  <form class="inputbox" id="chatForm">
   <input id="userInput" placeholder="Message ESUKA AI..." autocomplete="off">
   <button id="sendBtn" type="submit">Send ➤</button>
  </form>
  <div class="note">AI can make mistakes. Verify important information.</div>
 </footer>
</main>
</div>

<script>
const API_URL = "https://esuka-ai.kataribhai1.workers.dev/";

const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");

let history = [];

function addMessage(text, type){
 if(welcome) welcome.remove();

 const div = document.createElement("div");
 div.className = "message " + type;
 div.textContent = text;
 messages.appendChild(div);
 messages.scrollTop = messages.scrollHeight;
 return div;
}

document.getElementById("newChat").addEventListener("click",()=>{
 history = [];
 messages.innerHTML = `
 <div class="welcome" id="welcome">
 <h1>Welcome to ESUKA AI</h1>
 <p>Your personal AI assistant. Ask anything.</p>
 </div>`;
});

form.addEventListener("submit",async(e)=>{
 e.preventDefault();

 const message = input.value.trim();
 if(!message) return;

 addMessage(message,"user");
 input.value = "";
 sendBtn.disabled = true;
 sendBtn.textContent = "...";

 const loading = addMessage("ESUKA AI is thinking...","bot");

 try{
  const response = await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:message,
    history:history
   })
  });

  const data = await response.json();

  if(!response.ok || !data.reply){
   throw new Error(
    (data.error || "AI request failed") +
    " | HTTP: " + (data.status || response.status) +
    " | Detail: " + (data.detail || "No details returned")
   );
  }

  loading.textContent = data.reply;

  history.push(
   {role:"user",parts:[{text:message}]},
   {role:"assistant",parts:[{text:data.reply}]}
  );

 }catch(error){
  loading.className = "message bot error";
  loading.textContent = "Connection problem:\n" + error.message;
 }

 sendBtn.disabled = false;
 sendBtn.textContent = "Send ➤";
 input.focus();
});
</script>
</body>
</html>
