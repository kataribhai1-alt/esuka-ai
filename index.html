
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESUKA AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09090f;color:#fff;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 padding:17px 20px;background:#11111b;
 border-bottom:1px solid #29293b;
 display:flex;justify-content:space-between;
 align-items:center
}
.logo{font-size:23px;font-weight:bold;color:#a78bfa}
#chat{
 flex:1;overflow-y:auto;padding:20px;
 display:flex;flex-direction:column;gap:18px
}
.message{
 max-width:85%;padding:14px 16px;
 border-radius:16px;line-height:1.5;
 overflow-wrap:anywhere
}
.user{
 align-self:flex-end;background:#663de5;
 border-bottom-right-radius:4px
}
.bot{
 align-self:flex-start;background:#191925;
 border:1px solid #303044;
 border-bottom-left-radius:4px
}
.actions{margin-top:12px;display:flex;gap:8px}
button{
 border:0;border-radius:10px;padding:10px 14px;
 color:white;background:#6845db;cursor:pointer
}
.listen{background:#29293c;font-size:13px}
#inputArea{
 padding:14px;background:#11111b;
 display:flex;gap:8px;border-top:1px solid #29293b
}
input{
 flex:1;min-width:0;padding:14px;
 border:1px solid #38384d;border-radius:12px;
 background:#20202d;color:white;outline:none
}
#status{font-size:12px;color:#aaa;padding:0 18px 8px}
</style>
</head>

<body>

<header>
 <div class="logo">✦ ESUKA AI</div>
 <button onclick="stopSpeech()">■ Stop Voice</button>
</header>

<div id="chat"></div>
<div id="status">Ready to chat</div>

<div id="inputArea">
 <button onclick="startMic()">🎙️</button>
 <input id="message" placeholder="Message ESUKA AI..."
 onkeydown="if(event.key==='Enter')sendMessage()">
 <button onclick="sendMessage()">➤</button>
</div>

<script>
const API_URL="https://esuka-ai.kataribhai1.workers.dev/";

const chat=document.getElementById("chat");
const input=document.getElementById("message");
const statusText=document.getElementById("status");

let history=[];
let recognition=null;

if("speechSynthesis" in window){
 speechSynthesis.cancel();
}

function addMessage(text,type){
 const box=document.createElement("div");
 box.className="message "+type;

 const content=document.createElement("div");
 content.textContent=text;
 box.appendChild(content);

 if(type==="bot"){
   const actions=document.createElement("div");
   actions.className="actions";

   const listen=document.createElement("button");
   listen.className="listen";
   listen.textContent="🔊 Listen";

   listen.onclick=()=>{
     if(speechSynthesis.speaking){
       stopSpeech();
       return;
     }
     resetListenButtons();
     speakText(text,listen);
   };

   const copy=document.createElement("button");
   copy.className="listen";
   copy.textContent="Copy";
   copy.onclick=()=>navigator.clipboard.writeText(text);

   actions.append(listen,copy);
   box.appendChild(actions);
 }

 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
}

function resetListenButtons(){
 document.querySelectorAll(".listen").forEach(btn=>{
   if(btn.textContent.includes("Stop"))btn.textContent="🔊 Listen";
 });
}

function speakText(text,button){
 if(!("speechSynthesis" in window)){
   statusText.textContent="Voice is not supported in this browser.";
   return;
 }

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="hi-IN";
 utterance.rate=0.95;

 const voices=speechSynthesis.getVoices();
 const preferred=voices.find(v=>
   /female|samantha|zira|heera|neerja/i.test(v.name)
 ) || voices.find(v=>v.lang.toLowerCase().startsWith("hi"));

 if(preferred)utterance.voice=preferred;

 utterance.onstart=()=>{
   button.textContent="■ Stop";
   statusText.textContent="Speaking...";
 };

 utterance.onend=()=>{
   button.textContent="🔊 Listen";
   statusText.textContent="Ready to chat";
 };

 utterance.onerror=()=>{
   button.textContent="🔊 Listen";
   statusText.textContent="Voice playback unavailable";
 };

 speechSynthesis.speak(utterance);
}

function stopSpeech(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
 resetListenButtons();
 statusText.textContent="Voice stopped";
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;

 stopSpeech();
 addMessage(message,"user");
 input.value="";
 statusText.textContent="ESUKA AI is thinking...";

 const typing=document.createElement("div");
 typing.className="message bot";
 typing.textContent="Typing...";
 chat.appendChild(typing);
 chat.scrollTop=chat.scrollHeight;

 try{
   const response=await fetch(API_URL,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       message:message,
       history:history
     })
   });

   if(!response.ok)throw new Error("API request failed");

   const data=await response.json();

   typing.remove();

   const reply=data.reply || data.response ||
                data.text || data.message ||
                "Mujhe response nahi mila.";

   history.push(
     {role:"user",content:message},
     {role:"assistant",content:reply}
   );

   addMessage(reply,"bot");
   statusText.textContent="Ready to chat";

 }catch(error){
   typing.remove();
   addMessage("Sorry, connection problem. Please try again.","bot");
   statusText.textContent="Connection error";
 }
}

// Voice input
function startMic(){
 const SpeechRecognition=
   window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
   statusText.textContent="Voice input is not supported in this browser.";
   return;
 }

 recognition=new SpeechRecognition();
 recognition.lang="hi-IN";
 recognition.interimResults=false;

 recognition.onstart=()=>{
   statusText.textContent="Listening...";
 };

 recognition.onresult=(event)=>{
   input.value=event.results[0][0].transcript;
   statusText.textContent="Voice received";
 };

 recognition.onerror=()=>{
   statusText.textContent="Microphone error. Check permission.";
 };

 recognition.onend=()=>{
   if(statusText.textContent==="Listening...")
     statusText.textContent="Ready to chat";
 };

 recognition.start();
}

speechSynthesis?.getVoices();
</script>
</body>
</html>
