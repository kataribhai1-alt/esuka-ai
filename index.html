<input
  type="file"
  id="photoPicker"
  accept="image/*"
  hidden
>

<script>
const galleryBtn = document.getElementById("attachBtn");
const photoPicker = document.getElementById("photoPicker");

if (galleryBtn && photoPicker) {
  galleryBtn.textContent = "▧";
  galleryBtn.title = "Gallery";

  galleryBtn.onclick = (e) => {
    e.preventDefault();
    photoPicker.click();
  };

  photoPicker.onchange = () => {
    const photo = photoPicker.files[0];
    if (photo) {
      console.log("Selected photo:", photo.name);
      // Yahan selected photo ko chat mein attach karne ka code lagega.
    }
  };
}
</script>
