
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESUKA AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#080912;color:#fff;
  height:100dvh;overflow:hidden
}
.app{display:flex;height:100dvh}
.sidebar{
  width:260px;background:#0d0e19;
  border-right:1px solid #25263a;
  padding:20px;display:flex;flex-direction:column;
  transition:.3s
}
.logo{
  font-size:25px;font-weight:800;
  letter-spacing:2px;
  background:linear-gradient(90deg,#a78bfa,#38bdf8);
  -webkit-background-clip:text;color:transparent
}
.tagline{color:#77798e;font-size:11px;margin-top:5px}
.newchat{
  margin-top:30px;padding:13px;border-radius:12px;
  background:linear-gradient(100deg,#7652e8,#3279df);
  color:white;border:0;font-size:14px;cursor:pointer
}
.sideheading{font-size:11px;color:#77798e;margin:25px 0 12px}
.history{overflow-y:auto;flex:1}
.history-item{
  padding:12px;border-radius:9px;color:#c4c5d3;
  font-size:13px;cursor:pointer;margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.history-item.active,.history-item:hover{background:#202137}
.sidebar-bottom{font-size:12px;color:#77798e;padding-top:15px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:65px;border-bottom:1px solid #25263a;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px
}
.topname{font-weight:bold;font-size:15px}
.status{font-size:11px;color:#55d6a0;margin-top:5px}
.menu{display:none;background:none;color:white;border:0;font-size:23px}
.chat{
  flex:1;overflow-y:auto;padding:30px 18px;
  scroll-behavior:smooth
}
.welcome{text-align:center;margin:12vh auto 30px;max-width:550px}
.orb{
  width:75px;height:75px;border-radius:25px;
  margin:0 auto 25px;
  background:linear-gradient(135deg,#8258ff,#20b9e8);
  display:grid;place-items:center;font-size:30px;
  box-shadow:0 0 50px #7955ff55
}
.welcome h1{font-size:32px;margin-bottom:12px}
.gradient{
  background:linear-gradient(90deg,#b18aff,#48caff);
  -webkit-background-clip:text;color:transparent
}
.welcome p{color:#85869c;line-height:1.6;font-size:14px}
.suggestions{
  display:flex;justify-content:center;gap:10px;
  flex-wrap:wrap;margin-top:25px
}
.suggestion{
  background:#141625;border:1px solid #292b43;
  padding:12px 15px;border-radius:12px;
  color:#c7c8d8;font-size:12px;cursor:pointer
}
.messages{max-width:850px;margin:auto}
.message{display:flex;gap:12px;margin:22px 0;align-items:flex-start}
.avatar{
  width:34px;height:34px;flex-shrink:0;
  border-radius:12px;display:grid;place-items:center;
  background:#25213f;font-size:14px
}
.user .avatar{background:#173b53}
.content{
  background:#141625;border:1px solid #282a40;
  padding:14px 16px;border-radius:4px 15px 15px 15px;
  line-height:1.65;font-size:14px;max-width:85%;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.user{justify-content:flex-end}
.user .content{
  background:#252044;border-color:#3a3267;
  border-radius:15px 4px 15px 15px
}
.user .avatar{order:2}
.msg-actions{margin-top:8px;display:flex;gap:8px}
.small-btn{
  border:1px solid #33354b;background:#171929;
  color:#aaaec3;border-radius:8px;padding:6px 10px;
  font-size:11px;cursor:pointer
}
.typing{color:#8d90a8;font-size:13px;padding:12px}
.composer-wrap{padding:12px 18px 20px}
.composer{
  max-width:850px;margin:auto;
  background:#141625;border:1px solid #34364e;
  border-radius:18px;padding:10px;
  display:flex;align-items:flex-end;gap:9px;
  box-shadow:0 10px 40px #0005
}
textarea{
  flex:1;resize:none;max-height:130px;
  min-height:40px;background:transparent;
  border:0;outline:0;color:white;
  padding:12px;font-size:14px;font-family:inherit
}
textarea::placeholder{color:#77798e}
.icon-btn{
  width:40px;height:40px;border:0;border-radius:12px;
  background:#25263a;color:#d8d9e8;cursor:pointer;
  font-size:17px;flex-shrink:0
}
.mic{background:#25263a}
.mic.listening{background:#e34c70;animation:pulse 1s infinite}
.send{
  background:linear-gradient(135deg,#8759f4,#3588ed);
  color:white;font-size:18px
}
@keyframes pulse{50%{box-shadow:0 0 0 8px #e34c7033}}
.note{text-align:center;color:#666981;font-size:10px;margin-top:10px}
.voice-settings{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:#999bb0
}
.voice-settings input{accent-color:#9772ff}
@media(max-width:650px){
 .sidebar{position:fixed;z-index:5;left:-270px;top:0;bottom:0}
 .sidebar.open{left:0}
 .menu{display:block}
 .topbar{padding:0 14px}
 .chat{padding:20px 12px}
 .welcome{margin-top:10vh}
 .welcome h1{font-size:27px}
 .composer-wrap{padding:10px}
 .content{max-width:90%}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">ESUKA AI</div>
  <div class="tagline">YOUR PERSONAL AI ASSISTANT</div>

  <button class="newchat" onclick="newChat()">＋ New Chat</button>

  <div class="sideheading">RECENT CONVERSATIONS</div>
  <div class="history" id="historyList"></div>

  <div class="sidebar-bottom">Created with care by Katari</div>
</aside>

<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:13px">
      <button class="menu" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="topname">ESUKA AI <span style="color:#8b75ed">✦</span></div>
        <div class="status">● Online Assistant</div>
      </div>
    </div>

    <label class="voice-settings">
      <input type="checkbox" id="autoVoice" checked>
      Voice reply
    </label>
  </header>

  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h1>Hey! I'm <span class="gradient">ESUKA AI</span></h1>
      <p>Your personal AI assistant. Ask me anything, share your ideas or just start a conversation.</p>

      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Tell me something interesting')">✦ Tell me something</button>
        <button class="suggestion" onclick="useSuggestion('Help me learn coding')">⌘ Learn coding</button>
        <button class="suggestion" onclick="useSuggestion('Give me a creative idea')">✧ Creative ideas</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </section>

  <div class="composer-wrap">
    <div class="composer">
      <button class="icon-btn mic" id="micBtn" onclick="toggleMic()" title="Speak">🎙</button>
      <textarea id="input" rows="1" placeholder="Message ESUKA AI..."></textarea>
      <button class="icon-btn" onclick="stopSpeech()" title="Stop voice">■</button>
      <button class="icon-btn send" onclick="sendMessage()">➤</button>
    </div>
    <div class="note">ESUKA AI can make mistakes. Check important information.</div>
  </div>
</main>
</div>

<script>
const API_URL = "https://esuka-ai.kataribhai1.workers.dev/";

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const micBtn = document.getElementById("micBtn");

let chats = JSON.parse(localStorage.getItem("esuka_ai_chats_v3") || "[]");
let currentChat = null;
let conversation = [];
let recognition = null;
let listening = false;
let voices = [];

function loadVoices(){
  if("speechSynthesis" in window){
    voices = speechSynthesis.getVoices();
  }
}
if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function saveChats(){
  localStorage.setItem("esuka_ai_chats_v3",JSON.stringify(chats));
}

function newChat(){
  currentChat = null;
  conversation = [];
  messages.innerHTML = "";
  welcome.style.display = "block";
  input.value = "";
  renderHistory();
  stopSpeech();
  document.getElementById("sidebar").classList.remove("open");
}

function renderHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  chats.forEach(c=>{
    const item = document.createElement("div");
    item.className = "history-item" + (c.id===currentChat?" active":"");
    item.textContent = "◈ " + c.title;
    item.onclick = ()=>openChat(c.id);
    list.appendChild(item);
  });
}

function openChat(id){
  const selected = chats.find(c=>c.id===id);
  if(!selected)return;
  currentChat = id;
  conversation = [...selected.messages];
  messages.innerHTML = "";
  welcome.style.display = "none";
  conversation.forEach(m=>addMessage(m.role,m.content,false));
  renderHistory();
  document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function useSuggestion(text){
  input.value = text;
  sendMessage();
}

function addMessage(role,text,save=true){
  welcome.style.display = "none";
  const row = document.createElement("div");
  row.className = "message " + (role==="user"?"user":"assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role==="user"?"👤":"✦";

  const wrap = document.createElement("div");
  const bubble = document.createElement("div");
  bubble.className = "content";
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if(role==="assistant"){
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    const listen = document.createElement("button");
    listen.className = "small-btn";
    listen.textContent = "🔊 Listen";
    listen.onclick = ()=>speakText(text);
    actions.appendChild(listen);
    wrap.appendChild(actions);
  }

  row.appendChild(avatar);
  row.appendChild(wrap);
  messages.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  const t = document.createElement("div");
  t.id = "typing";
  t.className = "typing";
  t.textContent = "ESUKA AI is thinking...";
  messages.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  document.getElementById("typing")?.remove();
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text)return;

  stopSpeech();
  input.value = "";
  input.style.height = "auto";

  if(!currentChat){
    currentChat = Date.now().toString();
    chats.unshift({id:currentChat,title:text.slice(0,32),messages:[]});
  }

  conversation.push({role:"user",content:text});
  addMessage("user",text);
  saveConversation();
  showTyping();

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:text,
        history:conversation.slice(-12,-1)
      })
    });

    const data = await response.json();
    removeTyping();

    if(!response.ok){
      throw new Error(data.error || "Server error: "+response.status);
    }

    const reply = data.reply || data.response || data.text;
    if(!reply)throw new Error("AI response was empty.");

    conversation.push({role:"assistant",content:reply});
    addMessage("assistant",reply);
    saveConversation();

    if(document.getElementById("autoVoice").checked){
      speakText(reply);
    }

  }catch(error){
    removeTyping();
    const errorText = "Connection problem: "+error.message;
    addMessage("assistant",errorText);
  }
}

function saveConversation(){
  const index = chats.findIndex(c=>c.id===currentChat);
  if(index>=0){
    chats[index].messages = [...conversation];
    chats[index].title = conversation.find(m=>m.role==="user")?.content.slice(0,32) || "New Chat";
    const item = chats.splice(index,1)[0];
    chats.unshift(item);
  }
  saveChats();
  renderHistory();
}

function speakText(text){
  if(!("speechSynthesis" in window)){
    alert("Voice output is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();

  const cleanText = text.replace(/[*#`_]/g,"");
  const utterance = new SpeechSynthesisUtterance(cleanText);
  const isHindi = /[\u0900-\u097F]/.test(cleanText) ||
    /\b(kya|hai|haan|nahi|kaise|mera|tum|aap|mujhe)\b/i.test(cleanText);

  utterance.lang = isHindi ? "hi-IN" : "en-US";
  utterance.rate = 1;
  utterance.pitch = 1.08;

  const preferred = isHindi
    ? ["heera","neerja","swara","female","google हिन्दी","hindi"]
    : ["samantha","zira","female","aria","jenny"];

  const matching = voices.find(v=>
    preferred.some(p=>v.name.toLowerCase().includes(p)) &&
    (isHindi ? v.lang.toLowerCase().startsWith("hi") : v.lang.toLowerCase().startsWith("en"))
  );

  const languageVoice = voices.find(v=>
    v.lang.toLowerCase().startsWith(isHindi?"hi":"en")
  );

  if(matching)utterance.voice=matching;
  else if(languageVoice)utterance.voice=languageVoice;

  speechSynthesis.speak(utterance);
}

function stopSpeech(){
  if("speechSynthesis" in window)speechSynthesis.cancel();
}

function toggleMic(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice input is not supported here. Try a browser that supports Speech Recognition.");
    return;
  }

  if(listening){
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = ()=>{
    listening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "●";
  };

  recognition.onresult = event=>{
    let finalText = "";
    for(let i=event.resultIndex;i<event.results.length;i++){
      finalText += event.results[i][0].transcript;
    }
    input.value = finalText;
  };

  recognition.onerror = event=>{
    console.log("Speech error:",event.error);
  };

  recognition.onend = ()=>{
    listening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎙";
  };

  recognition.start();
}

input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,130)+"px";
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

renderHistory();
</script>
</body>
</html>
