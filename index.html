
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090910">
<title>ESUKA AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#090910;
  --panel:#10101b;
  --border:rgba(255,255,255,.08);
  --muted:#9291a8;
  --purple:#9b65ff;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:var(--bg);
  color:#f5f3ff;
  font-family:Inter,sans-serif;
  height:100dvh;
  overflow:hidden;
}

button,input { font:inherit; }

.app { display:flex; height:100dvh; }

/* SIDEBAR */

.sidebar {
  width:265px;
  min-width:265px;
  background:#0d0d16;
  border-right:1px solid var(--border);
  padding:22px 15px;
  display:flex;
  flex-direction:column;
  z-index:5;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 8px 27px;
}

.logo {
  height:39px;
  width:39px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:19px;
  background:linear-gradient(135deg,#8b5cf6,#d946ef);
  box-shadow:0 0 25px #9b65ff55;
  animation:glow 3s infinite alternate;
}

.brand-name { font-size:19px; font-weight:800; }
.brand-name span { color:var(--purple); }

.new-chat {
  width:100%;
  border:1px solid #9b65ff55;
  border-radius:12px;
  padding:13px;
  color:white;
  background:linear-gradient(110deg,#8b5cf6,#b44be7);
  cursor:pointer;
  font-weight:600;
}

.section-label {
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  padding:27px 9px 12px;
}

.history-list { overflow-y:auto; flex:1; }

.history-item {
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 10px;
  margin-bottom:4px;
  border-radius:9px;
  color:#c9c6d9;
  cursor:pointer;
  font-size:13px;
}

.history-item:hover,
.history-item.active { background:#1c1b2c; color:white; }

.history-title {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.delete-chat {
  background:none;
  border:none;
  color:#888;
  cursor:pointer;
}

.sidebar-bottom {
  border-top:1px solid var(--border);
  padding:16px 8px 0;
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar {
  width:36px;
  height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#db5eea);
  display:grid;
  place-items:center;
  font-weight:800;
}

/* MAIN */

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(ellipse at 50% -20%,#51258b25,transparent 55%),
    var(--bg);
}

.topbar {
  height:66px;
  min-height:66px;
  padding:0 25px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0b0b13cc;
}

.top-left { display:flex; align-items:center; gap:13px; }
.menu-btn { display:none; background:none; color:white; border:0; font-size:23px; }

.status {
  display:flex;
  align-items:center;
  gap:7px;
  color:#aaa6bb;
  font-size:11px;
}

.status-dot {
  height:7px;
  width:7px;
  background:#42e89a;
  border-radius:50%;
  box-shadow:0 0 10px #42e89a;
}

/* CHAT */

.chat-area {
  flex:1;
  overflow-y:auto;
  padding:30px 20px;
}

.messages {
  max-width:820px;
  margin:auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
}

.welcome {
  margin:auto;
  text-align:center;
  padding:35px 10px;
  animation:appear .7s ease;
}

.welcome-logo {
  width:76px;
  height:76px;
  margin:0 auto 25px;
  border-radius:25px;
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:800;
  background:linear-gradient(135deg,#8b5cf6,#d946ef);
  box-shadow:0 0 55px #9b65ff66;
  animation:float 4s ease-in-out infinite;
}

.welcome h1 {
  font-size:clamp(27px,5vw,40px);
  margin-bottom:12px;
}

.welcome h1 span {
  background:linear-gradient(90deg,#a78bfa,#e879f9);
  color:transparent;
  background-clip:text;
}

.welcome p {
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.suggestions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  max-width:560px;
  margin:30px auto 0;
}

.suggestion {
  text-align:left;
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  background:#141420;
  color:#e8e4f7;
  cursor:pointer;
  font-size:12px;
  line-height:1.5;
}

.suggestion b {
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

.message {
  display:flex;
  gap:13px;
  margin:18px 0;
  animation:appear .3s ease;
}

.message.user { flex-direction:row-reverse; }

.message-avatar {
  height:34px;
  width:34px;
  min-width:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:linear-gradient(135deg,#8b5cf6,#d946ef);
}

.message.user .message-avatar { background:#29283a; }

.message-content {
  max-width:82%;
  padding:13px 16px;
  border:1px solid var(--border);
  border-radius:4px 14px 14px 14px;
  background:#151520;
  font-size:14px;
  line-height:1.8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user .message-content {
  background:linear-gradient(135deg,#37235a,#25203c);
  border-radius:14px 4px 14px 14px;
}

.message-actions {
  display:flex;
  gap:8px;
  margin-top:9px;
}

.voice-play {
  border:1px solid #9b65ff55;
  border-radius:8px;
  background:#241b35;
  color:#d6baff;
  padding:6px 10px;
  font-size:11px;
  cursor:pointer;
}

.typing {
  display:flex;
  gap:5px;
  padding:8px;
}

.typing span {
  height:7px;
  width:7px;
  background:#b58aff;
  border-radius:50%;
  animation:bounce .7s infinite alternate;
}

/* INPUT */

.input-section {
  padding:15px 20px 20px;
  background:linear-gradient(transparent,#090910 25%);
}

.input-wrap {
  max-width:820px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 10px 9px 17px;
  border:1px solid #393148;
  background:#151420;
  border-radius:16px;
}

.input-wrap:focus-within {
  border-color:#a16aff;
  box-shadow:0 0 25px #9b65ff20;
}

#messageInput {
  flex:1;
  min-width:0;
  background:none;
  border:none;
  outline:none;
  color:white;
  font-size:14px;
  padding:9px 0;
}

#messageInput::placeholder { color:#77748a; }

.icon-btn {
  height:40px;
  width:40px;
  min-width:40px;
  border:1px solid #393148;
  border-radius:12px;
  background:#211d2d;
  color:#c7a5ff;
  cursor:pointer;
  font-size:18px;
}

.icon-btn.active {
  background:#762e53;
  color:white;
  border-color:#ff70a6;
  animation:pulse 1s infinite;
}

.send-btn {
  height:42px;
  width:42px;
  min-width:42px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#8b5cf6,#c34fe9);
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send-btn:disabled { opacity:.5; }

.voice-status {
  text-align:center;
  color:#bd9cff;
  font-size:11px;
  min-height:17px;
  margin-top:8px;
}

.footer-note {
  text-align:center;
  font-size:10px;
  color:#69677b;
  margin-top:5px;
}

@keyframes glow {
  from { box-shadow:0 0 12px #9b65ff44; }
  to { box-shadow:0 0 30px #d946ef77; }
}

@keyframes float {
  50% { transform:translateY(-9px); }
}

@keyframes appear {
  from { opacity:0; transform:translateY(9px); }
  to { opacity:1; transform:translateY(0); }
}

@keyframes bounce { to { transform:translateY(-6px); opacity:.5; } }

@keyframes pulse {
  50% { box-shadow:0 0 18px #ff70a688; }
}

@media(max-width:700px) {
  .sidebar {
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    transform:translateX(-100%);
    transition:transform .3s;
    box-shadow:15px 0 50px #0008;
  }

  .sidebar.open { transform:translateX(0); }
  .menu-btn { display:block; }
  .topbar { padding:0 15px; }
  .chat-area { padding:20px 12px; }
  .input-section { padding:10px 10px 15px; }
  .suggestions { grid-template-columns:1fr; }
  .message-content { max-width:88%; font-size:13px; }
  .welcome h1 { font-size:29px; }
}

.overlay {
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:4;
}

.overlay.show { display:block; }
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">E</div>
    <div class="brand-name">ESUKA <span>AI</span></div>
  </div>

  <button class="new-chat" onclick="newChat()">＋ New Chat</button>

  <div class="section-label">Recent conversations</div>
  <div class="history-list" id="historyList"></div>

  <div class="sidebar-bottom">
    <div class="avatar">E</div>
    <div>
      <strong style="font-size:13px">ESUKA AI</strong>
      <div style="color:#9291a8;font-size:11px">Personal AI Assistant</div>
    </div>
  </div>
</aside>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<main class="main">

<header class="topbar">
  <div class="top-left">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div style="font-size:14px;font-weight:600">ESUKA AI</div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    AI Assistant
  </div>
</header>

<section class="chat-area" id="chatArea">
  <div class="messages" id="messages"></div>
</section>

<section class="input-section">
  <div class="input-wrap">

    <input
      id="messageInput"
      type="text"
      placeholder="Message ESUKA AI..."
      autocomplete="off"
    >

    <button class="icon-btn" id="micBtn"
      onclick="toggleListening()" title="Speak">🎙️</button>

    <button class="icon-btn" onclick="stopVoice()"
      title="Stop voice">⏹</button>

    <button class="send-btn" id="sendBtn"
      onclick="sendMessage()">↑</button>
  </div>

  <div class="voice-status" id="voiceStatus"></div>
  <div class="footer-note">
    ESUKA AI can make mistakes. Check important information.
  </div>
</section>

</main>
</div>

<script>
const API_URL = "https://esuka-ai.kataribhai1.workers.dev/";
const STORAGE_KEY = "esuka_ai_chats_v3";

let chats = [];
let currentChatId = null;
let isLoading = false;
let recognition = null;
let isListening = false;
let voices = [];

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const historyList = document.getElementById("historyList");
const chatArea = document.getElementById("chatArea");
const micBtn = document.getElementById("micBtn");
const voiceStatus = document.getElementById("voiceStatus");

/* VOICE SETUP */

function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voices = speechSynthesis.getVoices();
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getFemaleVoice(text) {
  const isHindi = /[\u0900-\u097F]/.test(text) ||
    /\b(hai|hain|kya|kaise|mujhe|aap|tum|nahi|haan|mera|karna)\b/i.test(text);

  const preferred = isHindi
    ? ["hi-IN", "hi"]
    : ["en-IN", "en-US", "en-GB"];

  const languageVoice = voices.filter(v =>
    preferred.some(lang =>
      v.lang.toLowerCase().startsWith(lang.toLowerCase())
    )
  );

  const female = languageVoice.find(v =>
    /female|woman|zira|samantha|susan|google.*female|heera|neerja/i.test(v.name)
  );

  return female || languageVoice[0] || voices.find(v =>
    /female|samantha|zira/i.test(v.name)
  ) || voices[0];
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    voiceStatus.textContent = "Voice playback is not supported in this browser.";
    return;
  }

  stopVoice();

  const utterance = new SpeechSynthesisUtterance(text);
  const voice = getFemaleVoice(text);

  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  } else {
    utterance.lang = "en-IN";
  }

  utterance.rate = 0.95;
  utterance.pitch = 1.12;
  utterance.volume = 1;

  utterance.onstart = () => {
    voiceStatus.textContent = "🔊 ESUKA AI is speaking...";
  };

  utterance.onend = () => {
    voiceStatus.textContent = "";
  };

  utterance.onerror = () => {
    voiceStatus.textContent = "Voice playback could not start.";
  };

  speechSynthesis.speak(utterance);
}

function stopVoice() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  voiceStatus.textContent = "";
}

/* SPEECH RECOGNITION */

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = "hi-IN";

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add("active");
    voiceStatus.textContent = "🎙️ Listening... Speak now";
  };

  recognition.onresult = event => {
    let transcript = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    inputEl.value = transcript;
  };

  recognition.onerror = event => {
    voiceStatus.textContent =
      event.error === "not-allowed"
        ? "Microphone permission denied. Allow microphone access."
        : "Voice input error: " + event.error;
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove("active");

    if (inputEl.value.trim()) {
      voiceStatus.textContent = "Voice captured. Tap send to submit.";
    }
  };
}

function toggleListening() {
  if (!recognition) {
    voiceStatus.textContent =
      "Speech recognition is not supported here. Try a supported browser.";
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  stopVoice();

  try {
    recognition.start();
  } catch (error) {
    voiceStatus.textContent = "Microphone could not start. Try again.";
  }
}

/* CHAT HISTORY */

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (error) {
    voiceStatus.textContent = "Storage is full. Some chat history may not save.";
  }
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    chats = [];
  }

  renderHistory();

  if (chats.length) {
    openChat(chats[0].id);
  } else {
    newChat();
  }
}

function createWelcome() {
  messagesEl.innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">E</div>
      <h1>Welcome to <span>ESUKA AI</span></h1>
      <p>Your intelligent AI assistant.<br>
      Ask anything. Explore everything.</p>

      <div class="suggestions">
        <button class="suggestion"
          onclick="useSuggestion('Mujhe ek website banana sikhao')">
          <b>✦ Website Ideas</b>
          Help me build a website
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Mujhe ek coding project idea do')">
          <b>⌘ Coding Help</b>
          Explore a coding project
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Mujhe kuch naya sikhao')">
          <b>✧ Learn Something</b>
          Discover something new
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Mujhe ek creative idea do')">
          <b>◈ Creative Ideas</b>
          Get inspired
        </button>
      </div>
    </div>
  `;
}

function newChat() {
  stopVoice();

  const chat = {
    id: Date.now().toString(),
    title: "New Chat",
    messages: [],
    updatedAt: Date.now()
  };

  chats.unshift(chat);
  currentChatId = chat.id;

  saveChats();
  renderHistory();
  createWelcome();
  closeSidebar();
  inputEl.focus();
}

function getCurrentChat() {
  return chats.find(chat => chat.id === currentChatId);
}

function openChat(id) {
  stopVoice();

  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  currentChatId = id;
  messagesEl.innerHTML = "";

  if (!chat.messages.length) {
    createWelcome();
  } else {
    chat.messages.forEach(message => {
      addMessage(message.role, message.text);
    });
  }

  renderHistory();
  closeSidebar();
  scrollBottom();
}

function renderHistory() {
  historyList.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item" +
      (chat.id === currentChatId ? " active" : "");

    const icon = document.createElement("span");
    icon.textContent = "◷";

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title;

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.title = "Delete chat";

    del.onclick = event => {
      event.stopPropagation();
      deleteChat(chat.id);
    };

    item.append(icon, title, del);
    item.onclick = () => openChat(chat.id);

    historyList.appendChild(item);
  });
}

function deleteChat(id) {
  chats = chats.filter(chat => chat.id !== id);

  if (currentChatId === id) currentChatId = null;

  saveChats();

  if (chats.length) {
    openChat(chats[0].id);
  } else {
    newChat();
  }

  renderHistory();
}

/* DISPLAY MESSAGES */

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "message-avatar";
  avatar.textContent = role === "user" ? "U" : "E";

  const content = document.createElement("div");
  content.className = "message-content";

  const textNode = document.createElement("div");
  textNode.textContent = text;
  content.appendChild(textNode);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const play = document.createElement("button");
    play.className = "voice-play";
    play.textContent = "🔊 Listen";

    play.onclick = () => speakText(text);

    actions.appendChild(play);
    content.appendChild(actions);
  }

  row.append(avatar, content);
  messagesEl.appendChild(row);

  scrollBottom();
  return row;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "message";
  row.id = "typingIndicator";

  const avatar = document.createElement("div");
  avatar.className = "message-avatar";
  avatar.textContent = "E";

  const content = document.createElement("div");
  content.className = "message-content";

  const dots = document.createElement("div");
  dots.className = "typing";

  for (let i = 0; i < 3; i++) {
    dots.appendChild(document.createElement("span"));
  }

  const label = document.createElement("small");
  label.style.color = "#999";
  label.textContent = "ESUKA AI is thinking...";

  content.append(dots, label);
  row.append(avatar, content);
  messagesEl.appendChild(row);
  scrollBottom();
}

function removeTyping() {
  document.getElementById("typingIndicator")?.remove();
}

function scrollBottom() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

function useSuggestion(text) {
  inputEl.value = text;
  sendMessage();
}

/* SEND MESSAGE */

async function sendMessage() {
  const message = inputEl.value.trim();

  if (!message || isLoading) return;

  if (isListening) recognition.stop();

  stopVoice();

  let chat = getCurrentChat();

  if (!chat) {
    newChat();
    chat = getCurrentChat();
  }

  if (!chat.messages.length) {
    chat.title = message.slice(0, 35);
  }

  chat.messages.push({
    role: "user",
    text: message
  });

  addMessage("user", message);

  inputEl.value = "";
  isLoading = true;
  sendBtn.disabled = true;

  saveChats();
  renderHistory();
  showTyping();

  try {
    const history = chat.messages
      .slice(0, -1)
      .slice(-12)
      .map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        history
      })
    });

    const data = await response.json();

    if (!response.ok || !data.reply) {
      throw new Error(
        (data.error || "AI request failed") +
        " | HTTP: " + response.status +
        " | Detail: " +
        (data.detail || data.geminiDetail || "No details returned")
      );
    }

    removeTyping();

    chat.messages.push({
      role: "assistant",
      text: data.reply
    });

    addMessage("assistant", data.reply);

    chat.updatedAt = Date.now();
    saveChats();
    renderHistory();

    // Automatically speak the AI response
    speakText(data.reply);

  } catch (error) {
    removeTyping();

    addMessage(
      "assistant",
      "Sorry, connection problem.\n\n" + error.message
    );

  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
    scrollBottom();
  }
}

/* SIDEBAR */

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

/* KEYBOARD */

inputEl.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

loadChats();
</script>

</body>
</html>
